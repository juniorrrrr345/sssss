<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories - Al Gran</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px auto;
            padding: 0 1.5rem;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .category-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .category-image-container {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255, 62, 165, 0.3), rgba(168, 85, 247, 0.3));
        }

        .category-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .category-icon-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            opacity: 0.9;
        }

        .category-info {
            padding: 25px;
            text-align: center;
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .category-description {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .category-count {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
        }

        .loading-skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 100%);
            background-size: 200% 100%;
            animation: loading 1.5s ease-in-out infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 768px) {
            .categories-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <div class="logo-text">Al Gran</div>
        
        <h1 class="title">Nos Catégories</h1>

        <div class="categories-grid" id="categoriesGrid">
            <!-- Les catégories seront chargées ici -->
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        let categories = [];

        // Charger les catégories depuis l'API
        async function loadCategories() {
            try {
                showLoading();
                const data = await fetchApi(API_CONFIG.ENDPOINTS.CATEGORIES);
                
                if (data.success) {
                    // Filtrer seulement les catégories actives
                    categories = data.categories.filter(c => c.is_active);
                    displayCategories(categories);
                }
            } catch (error) {
                console.error('Erreur lors du chargement des catégories:', error);
                showError('Impossible de charger les catégories. Veuillez réessayer plus tard.');
            }
        }

        // Afficher le chargement
        function showLoading() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = Array(6).fill(0).map(() => `
                <div class="category-card loading-skeleton">
                    <div class="category-image-container"></div>
                    <div class="category-info">
                        <div style="height: 24px; width: 60%; margin: 0 auto 10px; background: rgba(255,255,255,0.1); border-radius: 4px;"></div>
                        <div style="height: 16px; width: 80%; margin: 0 auto; background: rgba(255,255,255,0.1); border-radius: 4px;"></div>
                    </div>
                </div>
            `).join('');
        }

        // Afficher un message d'erreur
        function showError(message) {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: rgba(255, 255, 255, 0.6);">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 1rem; display: block; color: #ff6b6b;"></i>
                    <p style="font-size: 1.2rem;">${message}</p>
                </div>
            `;
        }

        // Créer une carte de catégorie
        function createCategoryCard(category) {
            const imageUrl = category.image_url || '';
            const icon = category.icon || '📦';
            const productCount = category.product_count || 0;
            
            return `
                <div class="category-card" data-id="${category.id}" onclick="goToCategory(${category.id}, '${category.slug}')">
                    <div class="category-image-container">
                        ${imageUrl ? `<img src="${imageUrl}" alt="${category.name}" class="category-image">` : ''}
                        <div class="category-icon-overlay">${icon}</div>
                    </div>
                    <div class="category-info">
                        <h2 class="category-title">${category.name}</h2>
                        ${category.description ? `<p class="category-description">${category.description}</p>` : ''}
                        <span class="category-count">${productCount} produit${productCount > 1 ? 's' : ''}</span>
                    </div>
                </div>
            `;
        }

        // Afficher les catégories
        function displayCategories(categoriesToDisplay) {
            const grid = document.getElementById('categoriesGrid');
            
            if (categoriesToDisplay.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: rgba(255, 255, 255, 0.6);">
                        <i class="fas fa-box-open" style="font-size: 3rem; margin-bottom: 1rem; display: block;"></i>
                        <p style="font-size: 1.2rem;">Aucune catégorie disponible pour le moment</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = categoriesToDisplay.map(createCategoryCard).join('');
        }

        // Naviguer vers une catégorie
        function goToCategory(id, slug) {
            // Rediriger vers la page produits avec filtre de catégorie
            window.location.href = `products.html?category=${id}`;
        }

        // Charger au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
        });
    </script>
</body>
</html>
