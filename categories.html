<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories - Al Gran</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <div class="logo-text">Al Gran</div>
        
        <h1 class="title">Nos Catégories</h1>
        <p class="subtitle" style="text-align: center; margin-bottom: 2rem;">Explorez notre sélection par catégorie</p>
        
        <div class="categories-grid" id="categoriesGrid">
            <!-- Les catégories seront chargées dynamiquement -->
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script src="script.js"></script>
    <script>
        // Charger les catégories depuis l'API
        const API_URL = 'http://localhost:8787';
        
        async function loadCategories() {
            try {
                const response = await fetch(`${API_URL}/api/categories`);
                const data = await response.json();
                
                if (data.success && data.categories) {
                    displayCategories(data.categories);
                }
            } catch (error) {
                console.error('Erreur lors du chargement des catégories:', error);
                // Afficher les catégories par défaut en cas d'erreur
                displayDefaultCategories();
            }
        }
        
        function displayCategories(categories) {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = categories.map(cat => `
                <div class="category-card" onclick="window.location.href='products.html?category=${cat.slug}'">
                    <div class="category-icon">${cat.icon || '📦'}</div>
                    <div class="category-info">
                        <h3>${cat.name}</h3>
                        <p>${cat.product_count || 0} produit${(cat.product_count || 0) > 1 ? 's' : ''}</p>
                    </div>
                </div>
            `).join('');
        }
        
        function displayDefaultCategories() {
            const defaultCategories = [
                { name: 'Extract', icon: '🔥', slug: 'extract', product_count: 0 },
                { name: 'Static-Sift', icon: '💎', slug: 'static-sift', product_count: 0 },
                { name: 'Frozen-Sift', icon: '❄️', slug: 'frozen-sift', product_count: 0 },
                { name: 'Dry-Sift', icon: '🌿', slug: 'dry-sift', product_count: 0 },
                { name: 'Weed', icon: '🍃', slug: 'weed', product_count: 0 }
            ];
            displayCategories(defaultCategories);
        }
        
        // Charger au démarrage
        loadCategories();
    </script>
</body>
</html>
