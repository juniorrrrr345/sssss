<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories - Al Gran</title>
    <link rel="stylesheet" href="style.css">
    <script src="icons.js"></script>
    <style>
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .category-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-primary);
            display: block;
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 10px 40px rgba(255, 62, 165, 0.3),
                0 0 60px rgba(168, 85, 247, 0.2);
        }

        .category-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, rgba(255, 62, 165, 0.2), rgba(168, 85, 247, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }

        .category-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .category-image::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 62, 165, 0.1), rgba(168, 85, 247, 0.1));
        }

        .category-info {
            padding: 1.5rem;
        }

        .category-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .category-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .category-count {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.3rem 0.8rem;
            background: rgba(255, 62, 165, 0.2);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary-pink);
        }
    </style>
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <div class="logo-text">Al Gran</div>
        
        <h1 class="title">Catégories</h1>

        <div class="categories-content">
            <p style="text-align: center; color: var(--text-secondary); font-size: 1rem; margin-bottom: 2rem;">
                Explorez nos différentes catégories de produits pour trouver ce qui vous convient.
            </p>
            
            <div class="categories-grid" id="categoriesGrid">
                <!-- Les catégories seront chargées ici -->
            </div>
        </div>
    </div>

            <span>Accueil</span>

    <script src="script.js"></script>
    <script>
        // Catégories disponibles
        const categories = [
            {
                id: 1,
                name: "Extract",
                description: "Extraits premium de haute qualité",
                icon: "",
                count: 0,
                image: "images/extract.jpg"
            },
            {
                id: 2,
                name: "Static-Sift",
                description: "Produits Static-Sift premium",
                icon: "",
                count: 0,
                image: "images/static-sift.jpg"
            },
            {
                id: 3,
                name: "Frozen-Sift",
                description: "Frozen-Sift de qualité supérieure",
                icon: "",
                count: 0,
                image: "images/frozen-sift.jpg"
            },
            {
                id: 4,
                name: "Dry-Sift",
                description: "Dry-Sift artisanal",
                icon: "",
                count: 0,
                image: "images/dry-sift.jpg"
            },
            {
                id: 5,
                name: "Weed",
                description: "Fleurs premium sélectionnées",
                icon: "",
                count: 0,
                image: "images/weed.jpg"
            }
        ];

        function createCategoryCard(category) {
            return `
                <a href="products.html?category=${encodeURIComponent(category.name)}" class="category-card">
                    <div class="category-image">
                        <img src="${category.image || 'images/product-placeholder.jpg'}" alt="${category.name}">
                    </div>
                    <div class="category-info">
                        <h2 class="category-title">${category.name}</h2>
                        <p class="category-description">${category.description}</p>
                        <span class="category-count">${category.count} produits</span>
                    </div>
                </a>
            `;
        }

        function displayCategories() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = categories.map(createCategoryCard).join('');
        }

        // Affichage initial
        displayCategories();
    </script>
</body>
</html>
