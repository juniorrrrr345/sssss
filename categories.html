<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="categories-style.css">
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="stars"></div>

    <div class="container">
        <h1 class="title">Catégories</h1>
        <p class="subtitle">Explorez nos différentes catégories de produits</p>

        <div class="categories-grid" id="categoriesGrid">
            <div class="loading">Chargement des catégories...</div>
        </div>
    </div>

    <!-- Navigation du bas -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Accueil</span>
        </a>
        <a href="products.html" class="nav-item">
            <i class="fas fa-shopping-bag"></i>
            <span>Produits</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <i class="fas fa-th"></i>
            <span>Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <i class="fas fa-envelope"></i>
            <span>Contact</span>
        </a>
    </nav>

    <script>
        // Configuration API
        const API_URL = window.API_URL || 'https://algran-api.calitek-junior.workers.dev';

        // Charger les catégories depuis l'API
        async function loadCategories() {
            const grid = document.getElementById('categoriesGrid');
            
            try {
                const response = await fetch(`${API_URL}/api/categories`);
                const data = await response.json();
                
                if (data.success && data.categories) {
                    grid.innerHTML = data.categories.map(cat => `
                        <a href="products.html?category=${cat.id}" class="category-card">
                            <div class="category-image">
                                ${cat.image_url ? 
                                    `<img src="${cat.image_url}" alt="${cat.name}">` : 
                                    `<span class="category-icon">${getIconForCategory(cat.name)}</span>`
                                }
                            </div>
                            <div class="category-info">
                                <h3 class="category-name">${cat.name}</h3>
                                <p class="category-description">${cat.description || 'Découvrez nos produits ' + cat.name}</p>
                                <span class="category-count">${cat.product_count || 0} produits</span>
                            </div>
                        </a>
                    `).join('');
                } else {
                    grid.innerHTML = '<div class="error">Aucune catégorie disponible pour le moment.</div>';
                }
            } catch (error) {
                console.error('Erreur:', error);
                grid.innerHTML = '<div class="error">Erreur de chargement des catégories. Veuillez réessayer plus tard.</div>';
            }
        }
        
        // Obtenir l'icône appropriée pour chaque catégorie
        function getIconForCategory(name) {
            const icons = {
                'Extract': '🔥',
                'Static-Sift': '💎', 
                'Frozen-Sift': '❄️',
                'Dry-Sift': '🌿',
                'Weed': '🍃',
                'Ye': '✨'
            };
            return icons[name] || '📦';
        }
        
        // Charger les catégories au chargement de la page
        document.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>
</html>
