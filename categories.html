<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Variables CSS */
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray-light: rgba(255, 255, 255, 0.1);
            --gray-medium: rgba(255, 255, 255, 0.3);
            --gray-dark: rgba(255, 255, 255, 0.6);
        }

        /* Reset et base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--black);
            color: var(--white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* Effet cosmique noir et blanc */
        .cosmic-background {
            position: fixed;
            inset: 0;
            background: var(--black);
            z-index: -2;
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .stars::before,
        .stars::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--white);
            box-shadow: 
                100px 100px var(--white), 200px 150px var(--white), 300px 50px var(--white),
                400px 200px var(--white), 500px 250px var(--white), 600px 100px var(--white),
                700px 300px var(--white), 800px 150px var(--white), 900px 350px var(--white),
                150px 250px var(--white), 250px 350px var(--white), 350px 450px var(--white),
                450px 400px var(--white), 550px 500px var(--white), 650px 550px var(--white),
                750px 450px var(--white), 850px 600px var(--white), 950px 650px var(--white);
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Container principal */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Titre principal */
        .title {
            font-size: 3rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            text-align: center;
            color: var(--gray-dark);
            font-size: 1rem;
            margin-bottom: 3rem;
        }

        /* Grille de catégories */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        /* Carte de catégorie */
        .category-card {
            background: var(--black);
            border: 2px solid var(--white);
            border-radius: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: var(--white);
            display: block;
            position: relative;
        }

        .category-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gray-light);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .category-card:hover::before {
            opacity: 1;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.2);
        }

        /* Image de catégorie */
        .category-image {
            width: 100%;
            height: 200px;
            background: var(--gray-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
            border-bottom: 2px solid var(--white);
        }

        .category-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.2);
        }

        .category-icon {
            filter: grayscale(100%);
            opacity: 0.8;
        }

        /* Informations de catégorie */
        .category-info {
            padding: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .category-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .category-description {
            font-size: 0.9rem;
            color: var(--gray-dark);
            line-height: 1.6;
        }

        .category-count {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: var(--white);
            color: var(--black);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Navigation du bas */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--black);
            border-top: 2px solid var(--white);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 70px;
            z-index: 1000;
        }

        .nav-item {
            color: var(--white);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--gray-light);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .nav-item:hover::before,
        .nav-item.active::before {
            opacity: 1;
        }

        .nav-item i {
            font-size: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .nav-item span {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .nav-item.active {
            background: var(--gray-light);
        }

        /* Message de chargement */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--gray-dark);
        }

        .error {
            text-align: center;
            padding: 3rem;
            color: var(--white);
            background: var(--gray-light);
            border: 2px solid var(--white);
            margin: 2rem 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }

            .categories-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="stars"></div>

    <div class="container">
        <h1 class="title">Catégories</h1>
        <p class="subtitle">Explorez nos différentes catégories de produits</p>

        <div class="categories-grid" id="categoriesGrid">
            <div class="loading">Chargement des catégories...</div>
        </div>
    </div>

    <!-- Navigation du bas -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Accueil</span>
        </a>
        <a href="products.html" class="nav-item">
            <i class="fas fa-shopping-bag"></i>
            <span>Produits</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <i class="fas fa-th"></i>
            <span>Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <i class="fas fa-envelope"></i>
            <span>Contact</span>
        </a>
    </nav>

    <script>
        // Configuration API
        const API_URL = window.API_URL || 'https://algran-api.calitek-junior.workers.dev';

        // Charger les catégories depuis l'API
        async function loadCategories() {
            const grid = document.getElementById('categoriesGrid');
            
            try {
                const response = await fetch(`${API_URL}/api/categories`);
                const data = await response.json();
                
                if (data.success && data.categories) {
                    grid.innerHTML = data.categories.map(cat => `
                        <a href="products.html?category=${cat.id}" class="category-card">
                            <div class="category-image">
                                ${cat.image_url ? 
                                    `<img src="${cat.image_url}" alt="${cat.name}">` : 
                                    `<span class="category-icon">${getIconForCategory(cat.name)}</span>`
                                }
                            </div>
                            <div class="category-info">
                                <h3 class="category-name">${cat.name}</h3>
                                <p class="category-description">${cat.description || 'Découvrez nos produits ' + cat.name}</p>
                                <span class="category-count">${cat.product_count || 0} produits</span>
                            </div>
                        </a>
                    `).join('');
                } else {
                    grid.innerHTML = '<div class="error">Aucune catégorie disponible pour le moment.</div>';
                }
            } catch (error) {
                console.error('Erreur:', error);
                grid.innerHTML = '<div class="error">Erreur de chargement des catégories. Veuillez réessayer plus tard.</div>';
            }
        }
        
        // Obtenir l'icône appropriée pour chaque catégorie
        function getIconForCategory(name) {
            const icons = {
                'Extract': '🔥',
                'Static-Sift': '💎', 
                'Frozen-Sift': '❄️',
                'Dry-Sift': '🌿',
                'Weed': '🍃',
                'Ye': '✨'
            };
            return icons[name] || '📦';
        }
        
        // Charger les catégories au chargement de la page
        document.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>
</html>
