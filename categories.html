<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Force le thème noir et blanc */
        :root {
            --primary-color: #fff;
            --secondary-color: #000;
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --card-bg: transparent;
            --card-border: rgba(255, 255, 255, 0.3);
        }

        body {
            background: #000 !important;
            color: #fff !important;
        }
        
        .container {
            background: transparent !important;
        }
        
        h1, h2, h3, p, span {
            color: #fff !important;
        }

        .title {
            color: #fff !important;
            font-weight: 900 !important;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 1), 0 0 10px rgba(0, 0, 0, 1) !important;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .category-card {
            background: transparent !important;
            border: 3px solid #fff !important;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: #fff !important;
            display: block;
        }

        .category-card:hover {
            background: rgba(255,255,255,0.1) !important;
            transform: translateY(-5px);
            border-color: #fff !important;
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.3);
        }

        .category-image {
            width: 100%;
            height: 200px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
            border-bottom: 2px solid #fff;
        }

        .category-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.2);
        }

        .category-info {
            padding: 1.5rem;
        }

        .category-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #fff !important;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);
        }

        .category-description {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8) !important;
            margin-bottom: 0.5rem;
        }

        .category-count {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.3rem 0.8rem;
            background: transparent;
            border: 2px solid #fff;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #fff !important;
            font-weight: 600;
        }

        /* Navigation du bas identique à contact.html */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #000 !important;
            border-top: 2px solid #fff !important;
            padding: 0.5rem 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff !important;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 15px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            color: #fff !important;
            background: rgba(255, 255, 255, 0.2) !important;
        }

        .nav-icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.3rem;
            transition: all 0.3s ease;
            background: transparent;
        }

        .nav-item.active .nav-icon-circle {
            background: rgba(255, 255, 255, 0.2);
            border-width: 3px;
        }

        .nav-icon-circle i {
            font-size: 1.2rem;
            color: #fff;
        }

        .nav-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff !important;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);
        }

        /* Supprimer toute mention du nom du shop */
        .shop-name, .logo-text {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <h1 class="title">Catégories</h1>

        <div class="categories-content">
            <p style="text-align: center; color: rgba(255, 255, 255, 0.8); font-size: 1rem; margin-bottom: 2rem; font-weight: 600; text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);">
                Explorez nos différentes catégories de produits pour trouver ce qui vous convient.
            </p>
            
            <div class="categories-grid" id="categoriesGrid">
                <!-- Les catégories seront chargées ici -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script src="config.js"></script>
    <script src="theme-loader.js"></script>
    <script>
        // Charger les catégories depuis l'API
        async function loadCategories() {
            try {
                const response = await fetch(`${window.API_URL || 'https://algran-api.calitek-junior.workers.dev'}/api/categories`);
                const data = await response.json();
                
                if (data.success && data.categories) {
                    const grid = document.getElementById('categoriesGrid');
                    grid.innerHTML = data.categories.map(cat => `
                        <a href="products.html?category=${cat.id}" class="category-card">
                            <div class="category-image">
                                ${cat.image_url ? 
                                    `<img src="${cat.image_url}" alt="${cat.name}" style="width: 100%; height: 100%; object-fit: cover;">` : 
                                    `<span style="font-size: 4rem; z-index: 1; text-shadow: 3px 3px 6px rgba(0, 0, 0, 1);">${cat.icon || getIconForCategory(cat.name)}</span>`
                                }
                            </div>
                            <div class="category-info">
                                <h3 class="category-name">${cat.name}</h3>
                                <p class="category-description">${cat.description || ''}</p>
                                <p class="category-count">${cat.product_count || 0} produits</p>
                            </div>
                        </a>
                    `).join('');
                }
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('categoriesGrid').innerHTML = '<p style="text-align: center; color: white;">Erreur de chargement</p>';
            }
        }
        
        function getIconForCategory(name) {
            const icons = {
                'Extract': '🔥',
                'Static-Sift': '💎', 
                'Frozen-Sift': '❄️',
                'Dry-Sift': '🌿',
                'Weed': '🍃',
                'Ye': '✨'
            };
            return icons[name] || '📦';
        }
        
        document.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>
</html>
