<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produit - Al Gran</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-detail-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem 120px;
        }

        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-top: 2rem;
        }

        /* Media Section */
        .product-media {
            position: sticky;
            top: 20px;
        }

        .product-image-main {
            width: 100%;
            height: 500px;
            border-radius: 20px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255, 62, 165, 0.2), rgba(168, 85, 247, 0.2));
            margin-bottom: 1rem;
        }

        .product-image-main img,
        .product-image-main video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Info Section */
        .product-info {
            color: white;
        }

        .product-badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 62, 165, 0.2);
            border: 1px solid rgba(255, 62, 165, 0.5);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .product-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .meta-icon {
            font-size: 1.2rem;
        }

        .product-description {
            margin-bottom: 2rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.8);
        }

        .product-description h3 {
            margin-bottom: 0.5rem;
            color: white;
        }

        /* Price Variants */
        .price-variants {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .price-variants h3 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .variant-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .variant-option:hover,
        .variant-option.selected {
            border-color: var(--primary-pink);
            background: rgba(255, 62, 165, 0.1);
            transform: translateX(5px);
        }

        .variant-quantity {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .variant-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-pink);
        }

        .variant-stock {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Order Button */
        .order-section {
            position: sticky;
            bottom: 0;
            background: linear-gradient(180deg, transparent, rgba(10, 14, 39, 0.95) 20%);
            padding: 2rem 0 1rem;
            margin-top: 2rem;
        }

        .order-button {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-pink), var(--primary-purple));
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .order-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 62, 165, 0.4);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            text-decoration: none;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .product-media {
                position: static;
            }

            .product-image-main {
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="product-detail-container">
        <a href="products.html" class="back-button">
            <i class="fas fa-arrow-left"></i>
            Retour aux produits
        </a>

        <div id="productContent">
            <p style="text-align: center; padding: 3rem; color: rgba(255,255,255,0.7);">
                Chargement du produit...
            </p>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        let selectedVariant = null;

        // Récupérer l'ID du produit depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        // Charger le produit
        async function loadProduct() {
            if (!productId) {
                showError('Aucun produit spécifié');
                return;
            }

            try {
                const data = await fetchApi(`/api/products/${productId}`);
                
                if (data.success && data.product) {
                    displayProduct(data.product);
                    
                    // Charger les variantes de prix si disponibles
                    loadProductVariants(productId);
                } else {
                    showError('Produit introuvable');
                }
            } catch (error) {
                console.error('Erreur lors du chargement du produit:', error);
                showError('Impossible de charger le produit');
            }
        }

        // Charger les variantes de prix (TODO: API endpoint)
        async function loadProductVariants(productId) {
            // Pour l'instant, on utilisera le prix principal
            // Plus tard: fetchApi(`/api/products/${productId}/variants`)
        }

        // Afficher le produit
        function displayProduct(product) {
            const hasVideo = product.video_url && product.video_url.trim() !== '';
            
            const html = `
                <div class="product-detail-grid">
                    <!-- Media Section -->
                    <div class="product-media">
                        <div class="product-image-main">
                            ${hasVideo ? `
                                <video controls autoplay muted loop>
                                    <source src="${product.video_url}" type="video/mp4">
                                    Votre navigateur ne supporte pas la vidéo.
                                </video>
                            ` : `
                                <img src="${product.image_url || 'https://via.placeholder.com/500x500/1a1a2e/ffffff?text=' + encodeURIComponent(product.name)}" 
                                     alt="${product.name}"
                                     onerror="this.src='https://via.placeholder.com/500x500/1a1a2e/ffffff?text=${encodeURIComponent(product.name)}'">
                            `}
                        </div>
                    </div>

                    <!-- Info Section -->
                    <div class="product-info">
                        ${product.badge ? `<div class="product-badge">${product.badge}</div>` : ''}
                        
                        <h1 class="product-title">${product.name}</h1>

                        <div class="product-meta">
                            ${product.category_name ? `
                                <div class="meta-item">
                                    <span class="meta-icon">${product.category_icon || '📦'}</span>
                                    <span>${product.category_name}</span>
                                </div>
                            ` : ''}
                            
                            ${product.farm_name ? `
                                <div class="meta-item">
                                    <span class="meta-icon">🌿</span>
                                    <span>${product.farm_name}</span>
                                </div>
                            ` : ''}
                            
                            ${product.stock_quantity > 0 ? `
                                <div class="meta-item">
                                    <span class="meta-icon">📦</span>
                                    <span>${product.stock_quantity} en stock</span>
                                </div>
                            ` : ''}
                        </div>

                        ${product.description || product.long_description ? `
                            <div class="product-description">
                                ${product.description ? `<p style="font-size: 1.1rem; margin-bottom: 1rem;">${product.description}</p>` : ''}
                                ${product.long_description ? `<p>${product.long_description}</p>` : ''}
                            </div>
                        ` : ''}

                        <!-- Prix -->
                        <div class="price-variants">
                            <h3><i class="fas fa-tags"></i> Prix</h3>
                            <div class="variant-option selected" data-price="${product.price}" data-unit="${product.unit}">
                                <div>
                                    <div class="variant-quantity">${product.unit}</div>
                                    ${product.stock_quantity > 0 ? `<div class="variant-stock">En stock</div>` : ''}
                                </div>
                                <div class="variant-price">${product.price}€</div>
                            </div>
                        </div>

                        <!-- Bouton Commander -->
                        <div class="order-section">
                            <button class="order-button" onclick="orderProduct()">
                                <i class="fas fa-shopping-cart"></i>
                                <span>Commander maintenant</span>
                                <span style="font-size: 1.5rem;">${product.price}€</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('productContent').innerHTML = html;
            document.title = `${product.name} - Al Gran`;
        }

        // Afficher une erreur
        function showError(message) {
            document.getElementById('productContent').innerHTML = `
                <div style="text-align: center; padding: 3rem;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #ff6b6b; margin-bottom: 1rem; display: block;"></i>
                    <p style="font-size: 1.2rem; color: rgba(255,255,255,0.7);">${message}</p>
                    <a href="products.html" style="display: inline-block; margin-top: 1rem; padding: 10px 20px; background: rgba(255,255,255,0.1); border-radius: 10px; color: white; text-decoration: none;">
                        Retour aux produits
                    </a>
                </div>
            `;
        }

        // Commander le produit
        async function orderProduct() {
            try {
                // Récupérer les paramètres (liens WhatsApp, Telegram)
                const data = await fetchApi(API_CONFIG.ENDPOINTS.SETTINGS);
                const settings = data.settings || {};

                const product = document.querySelector('.product-title').textContent;
                const price = document.querySelector('.variant-option.selected').dataset.price;
                const unit = document.querySelector('.variant-option.selected').dataset.unit;
                
                const message = `Bonjour ! Je voudrais commander :\n\n🛍️ ${product}\n💰 ${price}€ ${unit}`;

                // Priorité WhatsApp, puis Telegram
                if (settings.shop_whatsapp) {
                    const phone = settings.shop_whatsapp.replace(/\D/g, '');
                    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
                } else if (settings.shop_telegram) {
                    const username = settings.shop_telegram.replace('@', '');
                    window.open(`https://t.me/${username}`, '_blank');
                } else {
                    alert('⚠️ Aucun moyen de contact configuré. Veuillez contacter le vendeur.');
                }
            } catch (error) {
                console.error('Erreur:', error);
                alert('⚠️ Une erreur est survenue. Veuillez réessayer.');
            }
        }

        // Charger au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            loadProduct();
        });

        // Exposer la fonction
        window.orderProduct = orderProduct;
    </script>
</body>
</html>
