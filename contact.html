<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nous Contacter - Al Gran</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <div class="logo-text">Al Gran</div>
        
        <h1 class="title">Nous Contacter</h1>

        <div class="contact-cards">
            <!-- LinkTree Card -->
            <div class="contact-card disabled">
                <div class="card-icon">
                    <i class="fas fa-tree"></i>
                </div>
                <div class="card-content">
                    <h3>LinkTree</h3>
                    <p>Non disponible</p>
                </div>
            </div>

            <!-- WhatsApp Card -->
            <a href="https://wa.me/votre_numero" class="contact-card" target="_blank">
                <div class="card-icon whatsapp">
                    <i class="fab fa-whatsapp"></i>
                </div>
                <div class="card-content">
                    <h3>WhatsApp</h3>
                    <p>Contactez-nous directement sur WhatsApp</p>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>

            <!-- Telegram Card -->
            <a href="https://t.me/votre_canal" class="contact-card" target="_blank">
                <div class="card-icon telegram">
                    <i class="fab fa-telegram"></i>
                </div>
                <div class="card-content">
                    <h3>Canal Telegram</h3>
                    <p>Rejoignez notre canal Telegram pour les dernières mises à jour</p>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>

            <!-- Instagram Card -->
            <a href="https://instagram.com/votre_compte" class="contact-card" target="_blank">
                <div class="card-icon instagram">
                    <i class="fab fa-instagram"></i>
                </div>
                <div class="card-content">
                    <h3>Instagram</h3>
                    <p>Suivez-nous sur Instagram</p>
                </div>
                <div class="card-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script>
        // Charger les paramètres de contact depuis l'API
        async function loadContactSettings() {
            try {
                const data = await fetchApi(API_CONFIG.ENDPOINTS.SETTINGS);
                
                if (data.success) {
                    const settings = data.settings;
                    updateContactLinks(settings);
                }
            } catch (error) {
                console.error('Erreur lors du chargement des paramètres:', error);
            }
        }

        // Mettre à jour les liens de contact
        function updateContactLinks(settings) {
            // WhatsApp
            const whatsappCard = document.querySelector('a[href*="wa.me"]');
            if (whatsappCard && settings.shop_whatsapp) {
                const whatsappNumber = settings.shop_whatsapp.replace(/\D/g, ''); // Nettoyer le numéro
                whatsappCard.href = `https://wa.me/${whatsappNumber}`;
                whatsappCard.classList.remove('disabled');
            } else if (whatsappCard) {
                whatsappCard.classList.add('disabled');
                whatsappCard.removeAttribute('href');
            }

            // Telegram
            const telegramCard = document.querySelector('a[href*="t.me"]');
            if (telegramCard && settings.shop_telegram) {
                const telegramUsername = settings.shop_telegram.replace('@', '');
                telegramCard.href = `https://t.me/${telegramUsername}`;
                telegramCard.classList.remove('disabled');
            } else if (telegramCard) {
                telegramCard.classList.add('disabled');
                telegramCard.removeAttribute('href');
            }

            // Instagram
            const instagramCard = document.querySelector('a[href*="instagram.com"]');
            if (instagramCard && settings.shop_instagram) {
                const instagramUsername = settings.shop_instagram.replace('@', '');
                instagramCard.href = `https://instagram.com/${instagramUsername}`;
                instagramCard.classList.remove('disabled');
            } else if (instagramCard) {
                instagramCard.classList.add('disabled');
                instagramCard.removeAttribute('href');
            }

            // LinkTree
            const linktreeCard = document.querySelector('.contact-card.disabled');
            if (linktreeCard && settings.shop_linktree) {
                linktreeCard.classList.remove('disabled');
                const newLink = document.createElement('a');
                newLink.href = settings.shop_linktree;
                newLink.className = 'contact-card';
                newLink.target = '_blank';
                newLink.innerHTML = linktreeCard.innerHTML;
                linktreeCard.parentNode.replaceChild(newLink, linktreeCard);
            }
        }

        // Charger au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            loadContactSettings();
        });
    </script>
</body>
</html>
