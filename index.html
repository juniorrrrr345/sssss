<!DOCTYPE html>
<html lang="fr">

    <title>Menu Cannabis - Saveurs Cosmiques</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

                </div>
                <div class="product-info">
                    <h3>Static-Sift</h3>

            </div>
            
            <div class="product-card">

                </div>
                <div class="product-info">
                    <h3>Weed</h3>
                    <p>Explore Weed</p>

        <div class="neon-logo">

    <nav class="bottom-nav">
