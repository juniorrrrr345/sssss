<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tous les Produits</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">Tous les Produits</h1>
            
            <div class="search-filter-bar">
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Rechercher par nom, catégorie ou farm...">
                </div>
                <button class="filter-btn" id="filterBtn">
                    <span>🔻</span> Filtres
                </button>
            </div>
        </header>

        <div class="products-grid" id="productsGrid">
            <!-- Les produits seront générés dynamiquement -->
        </div>
    </div>

    <!-- Modal des filtres -->
    <div class="filter-modal" id="filterModal">
        <div class="filter-modal-content">
            <div class="filter-modal-header">
                <h2>Filtres</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="filter-modal-body">
                <div class="filter-intro">
                    <p>Les filtres avancés seront bientôt disponibles ! 🎯</p>
                </div>
                <div class="filter-options">
                    <h3>Vous pourrez filtrer par :</h3>
                    <ul class="filter-list">
                        <li>📂 Catégorie</li>
                        <li>💰 Prix</li>
                        <li>📦 Type de produit</li>
                        <li>🌍 Origine</li>
                    </ul>
                </div>
            </div>
            <div class="filter-modal-footer">
                <button class="btn-ok" id="btnOk">OK</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <div class="nav-icon-circle">
                <span class="nav-icon">🏠</span>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item">
            <div class="nav-icon-circle">
                <span class="nav-icon">📦</span>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-circle">
                <span class="nav-icon">🛒</span>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <span class="nav-icon">✉️</span>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
