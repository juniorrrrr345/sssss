<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVEC AMOUR - Accueil</title>
    <link rel="stylesheet" href="home-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Effet d'arrière-plan cosmique -->
    <div class="cosmic-background"></div>

    <!-- Logo géant AVEC en arrière-plan -->
    <div class="giant-logo">AVEC</div>
    <div class="logo-subtitle">Amour</div>

    <!-- Arc-en-ciel décoratif -->
    <div class="rainbow-arc"></div>

    <!-- Titre principal -->
    <div style="text-align: center; padding: 3rem 1rem 1rem; position: relative; z-index: 10;">
        <h1 style="font-size: clamp(2rem, 6vw, 4rem); font-weight: bold; color: #ffffff; text-shadow: 0 0 30px rgba(255, 255, 255, 0.5); margin: 0; line-height: 1.2;">
            Bienvenue Dans L'Univers
        </h1>
    </div>

    <!-- Contenu principal -->
    <div class="container" id="servicesContainer">
        <!-- Les services seront chargés dynamiquement ici -->
        <div style="text-align: center; padding: 3rem; color: rgba(255,255,255,0.6);">
            <i class="fas fa-spinner fa-spin" style="font-size: 2rem;"></i>
            <p style="margin-top: 1rem;">Chargement des services...</p>
        </div>
    </div>

    <!-- Bas de page / Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script>
        // Configuration API
        const API_URL = 'https://algran-api.calitek-junior.workers.dev';

        // Charger les informations de la boutique
        async function loadShopInfo() {
            console.log('Loading shop info...');
            try {
                const [settingsResponse, servicesResponse] = await Promise.all([
                    fetch(`${API_URL}/api/settings`),
                    fetch(`${API_URL}/api/services`)
                ]);
                
                console.log('Responses received');
                const settingsData = await settingsResponse.json();
                const servicesData = await servicesResponse.json();
                console.log('Settings:', settingsData);
                console.log('Services:', servicesData);
                
                // Mettre à jour le nom de la boutique
                if (settingsData.success && settingsData.settings) {
                    const shopName = settingsData.settings.shop_name || 'Al Gran';
                    const shopSubtitle = settingsData.settings.shop_subtitle || 'Amour';
                    const backgroundImage = settingsData.settings.background_image_url;
                    
                    document.querySelector('.giant-logo').textContent = shopName;
                    document.querySelector('.logo-subtitle').textContent = shopSubtitle;
                    document.title = `${shopName} ${shopSubtitle} - Accueil`;
                    
                    // Appliquer l'image de fond si définie
                    if (backgroundImage) {
                        document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('${backgroundImage}')`;
                        document.body.style.backgroundSize = 'cover';
                        document.body.style.backgroundPosition = 'center';
                        document.body.style.backgroundAttachment = 'fixed';
                        document.body.style.backgroundRepeat = 'no-repeat';
                    }
                }
                
                // Afficher les services
                if (servicesData.success && servicesData.services && servicesData.services.length > 0) {
                    displayServices(servicesData.services);
                } else {
                    displayDefaultServices();
                }
            } catch (error) {
                console.error('Erreur:', error);
                displayDefaultServices();
            }
        }

        // Afficher les services
        function displayServices(services) {
            const container = document.getElementById('servicesContainer');
            
            const servicesHTML = services.map(service => `
                <section class="service-section">
                    <h2 class="section-title">
                        <span style="font-size: 1.5rem;">${service.icon}</span>
                        ${service.title}
                    </h2>
                    <div class="section-content">
                        ${service.content}
                    </div>
                </section>
            `).join('');
            
            container.innerHTML = servicesHTML;
        }

        // Afficher les services par défaut
        function displayDefaultServices() {
            const container = document.getElementById('servicesContainer');
            container.innerHTML = `
                <section class="service-section">
                    <h2 class="section-title">
                        <i class="fas fa-heart"></i>
                        Nos Services
                    </h2>
                    <div class="section-content">
                        <p>Bienvenue sur AVEC AMOUR ! Nous vous proposons une très large sélection de produits sélectionnés par nos soins parmi ce qui se fait de mieux dans le monde. Les meilleurs prix du marché, du réassort fréquent et un service imbattable. 🚀</p>
                        <p>Livraisons/Meetup dans toute l'ile de France, le jour même, envois de France à France ou à l'international avec suivis, preuves de dépôts et assurances. 👍 😜 🌍</p>
                    </div>
                </section>
                <section class="delivery-section">
                    <h2 class="section-title">
                        <i class="fas fa-map-marker-alt"></i>
                        Zone de Livraison
                    </h2>
                    <div class="section-content">
                        <div class="department-grid">
                            <div class="department-badge">75</div>
                            <div class="department-badge">77</div>
                            <div class="department-badge">78</div>
                            <div class="department-badge">91</div>
                            <div class="department-badge">92</div>
                            <div class="department-badge">93</div>
                            <div class="department-badge">94</div>
                            <div class="department-badge">95</div>
                        </div>
                    </div>
                </section>
            `;
        }

        // Charger au démarrage
        document.addEventListener('DOMContentLoaded', loadShopInfo);
    </script>
</body>
</html>
