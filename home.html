<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVEC AMOUR - Accueil</title>
    <link rel="stylesheet" href="home-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>
    <!-- Effet d'arrière-plan cosmique -->
    <div class="cosmic-background"></div>
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <!-- Logo géant AVEC en arrière-plan -->
    <div class="giant-logo" id="mainLogo">AVEC</div>
    <div class="logo-subtitle" id="subLogo">Amour</div>

    <!-- Arc-en-ciel décoratif -->
    <div class="rainbow-arc"></div>

    <!-- Animation Lottie Hero -->
    <div id="heroAnimation" style="position: fixed; top: 10%; right: 5%; width: 300px; height: 300px; z-index: 1; pointer-events: none; opacity: 0.6;"></div>

    <!-- Contenu principal -->
    <div class="container">
        <!-- Section Nos Services -->
        <section class="service-section">
            <h2 class="section-title">
                <i class="fas fa-heart"></i>
                Nos Services
            </h2>
            <div class="section-content" id="servicesContent">
                <p>Chargement...</p>
            </div>
        </section>

        <!-- Section Zone de Livraison -->
        <section class="delivery-section">
            <h2 class="section-title">
                <i class="fas fa-map-marker-alt"></i>
                Zone de Livraison
            </h2>
            <div class="section-content">
                <div class="department-grid" id="deliveryZones">
                    <div class="department-badge">Chargement...</div>
                </div>
            </div>
        </section>
    </div>

    <!-- Bas de page / Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script src="config.js"></script>
    <script>
        // Charger les paramètres de la page d'accueil
        async function loadHomeSettings() {
            try {
                const data = await fetchApi(API_CONFIG.ENDPOINTS.SETTINGS);
                
                if (data.success) {
                    const settings = data.settings;
                    updateHomeContent(settings);
                }
            } catch (error) {
                console.error('Erreur lors du chargement des paramètres:', error);
                // Afficher le contenu par défaut en cas d'erreur
                showDefaultContent();
            }
        }

        // Mettre à jour le contenu de la page
        function updateHomeContent(settings) {
            // Titre principal
            if (settings.home_welcome_title) {
                const words = settings.home_welcome_title.split(' ');
                const mainLogo = document.getElementById('mainLogo');
                const subLogo = document.getElementById('subLogo');
                
                if (words.length >= 2) {
                    mainLogo.textContent = words[0];
                    subLogo.textContent = words.slice(1).join(' ');
                } else {
                    mainLogo.textContent = settings.home_welcome_title;
                    subLogo.textContent = '';
                }
            }

            // Textes de présentation
            const servicesContent = document.getElementById('servicesContent');
            if (settings.home_services_text || settings.home_delivery_text) {
                let html = '';
                if (settings.home_services_text) {
                    html += `<p>${settings.home_services_text}</p>`;
                }
                if (settings.home_delivery_text) {
                    html += `<p>${settings.home_delivery_text}</p>`;
                }
                servicesContent.innerHTML = html;
            }

            // Zones de livraison
            if (settings.home_delivery_zones) {
                const zones = settings.home_delivery_zones.split(',').map(z => z.trim());
                const deliveryZones = document.getElementById('deliveryZones');
                deliveryZones.innerHTML = zones.map(zone => 
                    `<div class="department-badge">${zone}</div>`
                ).join('');
            }
        }

        // Afficher le contenu par défaut en cas d'erreur
        function showDefaultContent() {
            document.getElementById('servicesContent').innerHTML = `
                <p>Bienvenue sur AVEC AMOUR ! Nous vous proposons une très large sélection de produits sélectionnés par nos soins parmi ce qui se fait de mieux dans le monde. Les meilleurs prix du marché, du réassort fréquent et un service imbattable. 🚀</p>
                <p>Livraisons/Meetup dans toute l'ile de France, le jour même, envois de France à France ou à l'international avec suivis, preuves de dépôts et assurances. 👍 😜 🌍</p>
            `;
            
            document.getElementById('deliveryZones').innerHTML = `
                <div class="department-badge">75</div>
                <div class="department-badge">77</div>
                <div class="department-badge">78</div>
                <div class="department-badge">91</div>
                <div class="department-badge">92</div>
                <div class="department-badge">93</div>
                <div class="department-badge">94</div>
                <div class="department-badge">95</div>
            `;
        }

        // Initialiser l'animation Lottie hero
        document.addEventListener('DOMContentLoaded', () => {
            // Charger les paramètres
            loadHomeSettings();
            
            // Animation Lottie
            lottie.loadAnimation({
                container: document.getElementById('heroAnimation'),
                renderer: 'svg',
                loop: true,
                autoplay: true,
                path: 'https://lottie.host/b7f9d8e8-0a0c-4d52-a5e0-3a4d9c8f7b6a/VZ3gIHxd2M.json' // Animation cosmique/shopping
            });
        });
    </script>
</body>
</html>
