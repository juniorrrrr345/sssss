<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVEC AMOUR - Accueil</title>
    <link rel="stylesheet" href="home-style.css">
    <link rel="stylesheet" href="black-white-override.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
</head>
<body>
    <!-- Effet d'arrière-plan cosmique -->
    <div class="cosmic-background"></div>
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <!-- Logo géant en arrière-plan -->
    <div class="giant-logo" id="mainLogo" style="text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.9);">AVEC</div>
    <div class="logo-subtitle" id="subLogo" style="text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);">Amour</div>

    <!-- Arc-en-ciel décoratif -->
    <div class="rainbow-arc"></div>

    <!-- Animation Lottie Hero -->
    <div id="heroAnimation" style="position: fixed; top: 10%; right: 5%; width: 300px; height: 300px; z-index: 1; pointer-events: none; opacity: 0.6;"></div>

    <!-- Contenu principal -->
    <div class="container" id="servicesContainer">
        <!-- Les services seront chargés ici dynamiquement -->
        <p style="text-align: center; color: rgba(255,255,255,0.7); padding: 2rem;">Chargement...</p>
    </div>

    <!-- Bas de page / Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script src="config.js"></script>
    <script src="theme-loader.js"></script>
    <script>
        // Charger les services depuis l'API
        async function loadServices() {
            try {
                const data = await fetchApi('/api/services');
                
                if (data.success && data.services) {
                    // Filtrer seulement les services actifs et les trier par ordre
                    const activeServices = data.services
                        .filter(s => s.is_active)
                        .sort((a, b) => a.display_order - b.display_order);
                    
                    displayServices(activeServices);
                }
            } catch (error) {
                console.error('Erreur lors du chargement des services:', error);
                showDefaultContent();
            }
        }

        // Charger les paramètres (pour le titre)
        async function loadSettings() {
            try {
                const data = await fetchApi(API_CONFIG.ENDPOINTS.SETTINGS);
                
                if (data.success && data.settings) {
                    updateTitle(data.settings);
                }
            } catch (error) {
                console.error('Erreur lors du chargement des paramètres:', error);
            }
        }

        // Mettre à jour le titre
        function updateTitle(settings) {
            const mainLogo = document.getElementById('mainLogo');
            const subLogo = document.getElementById('subLogo');
            
            // Priorité : shop_name, sinon home_welcome_title
            const titleToUse = settings.shop_name || settings.home_welcome_title || 'AVEC AMOUR';
            const words = titleToUse.split(' ');
            
            if (words.length >= 2) {
                mainLogo.textContent = words[0];
                subLogo.textContent = words.slice(1).join(' ');
            } else {
                mainLogo.textContent = titleToUse;
                subLogo.textContent = '';
            }
        }

        // Afficher les services
        function displayServices(services) {
            const container = document.getElementById('servicesContainer');
            
            if (services.length === 0) {
                showDefaultContent();
                return;
            }
            
            let html = '';
            
            services.forEach(service => {
                // Vérifier si c'est un service de type "Zone de Livraison" (avec départements)
                const isDeliveryZone = service.title.toLowerCase().includes('zone') || 
                                     service.title.toLowerCase().includes('livraison') && 
                                     service.content.match(/^\d+/);
                
                if (isDeliveryZone && service.content.match(/^[\d,\s]+$/)) {
                    // Service avec départements
                    const zones = service.content.split(',').map(z => z.trim());
                    html += `
                        <section class="delivery-section" style="background: transparent; padding: 2rem; border-radius: 15px; border: 3px solid #fff; margin-bottom: 2rem;">
                            <h2 class="section-title" style="color: #fff; font-weight: 900; font-size: 2rem; margin-bottom: 1.5rem; text-shadow: 3px 3px 6px rgba(0,0,0,1);">
                                ${service.icon ? `<span style="font-size: 1.2em;">${service.icon}</span>` : '<i class="fas fa-map-marker-alt"></i>'}
                                ${service.title}
                            </h2>
                            <div class="section-content">
                                <div class="department-grid">
                                    ${zones.map(zone => `<div class="department-badge" style="background: transparent; border: 3px solid #fff; color: #fff; font-weight: 900; padding: 12px 20px; border-radius: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,1);">${zone}</div>`).join('')}
                                </div>
                            </div>
                        </section>
                    `;
                } else {
                    // Service standard avec texte
                    html += `
                        <section class="service-section" style="background: transparent; padding: 2rem; border-radius: 15px; border: 3px solid #fff; margin-bottom: 2rem;">
                            <h2 class="section-title" style="color: #fff; font-weight: 900; font-size: 2rem; margin-bottom: 1.5rem; text-shadow: 3px 3px 6px rgba(0,0,0,1);">
                                ${service.icon ? `<span style="font-size: 1.2em;">${service.icon}</span>` : '<i class="fas fa-heart"></i>'}
                                ${service.title}
                            </h2>
                            <div class="section-content" style="color: #fff; font-size: 1.15rem; line-height: 2; font-weight: 600; text-shadow: 2px 2px 4px rgba(0,0,0,1);">
                                <p>${service.content}</p>
                            </div>
                        </section>
                    `;
                }
            });
            
            container.innerHTML = html;
        }

        // Afficher le contenu par défaut en cas d'erreur
        function showDefaultContent() {
            const container = document.getElementById('servicesContainer');
            container.innerHTML = `
                <section class="service-section">
                    <h2 class="section-title">
                        <i class="fas fa-heart"></i>
                        Nos Services
                    </h2>
                    <div class="section-content">
                        <p>Bienvenue sur AVEC AMOUR ! Nous vous proposons une très large sélection de produits sélectionnés par nos soins parmi ce qui se fait de mieux dans le monde. Les meilleurs prix du marché, du réassort fréquent et un service imbattable. 🚀</p>
                    </div>
                </section>
                <section class="service-section">
                    <h2 class="section-title">
                        <i class="fas fa-truck"></i>
                        Livraison
                    </h2>
                    <div class="section-content">
                        <p>Livraisons/Meetup dans toute l'ile de France, le jour même, envois de France à France ou à l'international avec suivis, preuves de dépôts et assurances. 👍 😜 🌍</p>
                    </div>
                </section>
                <section class="delivery-section">
                    <h2 class="section-title">
                        <i class="fas fa-map-marker-alt"></i>
                        Zone de Livraison
                    </h2>
                    <div class="section-content">
                        <div class="department-grid">
                            <div class="department-badge">75</div>
                            <div class="department-badge">77</div>
                            <div class="department-badge">78</div>
                            <div class="department-badge">91</div>
                            <div class="department-badge">92</div>
                            <div class="department-badge">93</div>
                            <div class="department-badge">94</div>
                            <div class="department-badge">95</div>
                        </div>
                    </div>
                </section>
            `;
        }

        // Initialiser
        document.addEventListener('DOMContentLoaded', () => {
            // Charger les services et le titre
            loadServices();
            loadSettings();
            
            // Animation Lottie (optionnel - peut causer des erreurs 403)
            try {
                lottie.loadAnimation({
                    container: document.getElementById('heroAnimation'),
                    renderer: 'svg',
                    loop: true,
                    autoplay: true,
                    path: 'https://lottie.host/b7f9d8e8-0a0c-4d52-a5e0-3a4d9c8f7b6a/VZ3gIHxd2M.json'
                });
            } catch (error) {
                console.log('Animation Lottie non disponible');
            }
        });
    </script>
</body>
</html>
