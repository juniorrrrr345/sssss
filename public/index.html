<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avec Amour - Boutique Magique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    
    <header>
        <h1 class="shop-title">Avec Amour</h1>
        <p class="shop-subtitle">✨ Boutique Magique ✨</p>
    </header>

    <main>
        <!-- Barre de recherche et filtres -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Rechercher un produit..." class="search-bar">
            <select id="categoryFilter" class="filter-select">
                <option value="">Toutes les catégories</option>
            </select>
        </div>

        <!-- Grille de produits -->
        <div id="productsGrid" class="products-grid">
            <!-- Les produits seront chargés dynamiquement ici -->
        </div>
    </main>

    <!-- Navigation en bas -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Accueil</span>
        </a>
        <a href="#products" class="nav-item">
            <span class="nav-icon">🛍️</span>
            <span>Produits</span>
        </a>
        <a href="#categories" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>Catégories</span>
        </a>
        <a href="#contact" class="nav-item">
            <span class="nav-icon">💬</span>
            <span>Contact</span>
        </a>
    </nav>

    <!-- Modal de contact -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Nous contacter</h2>
            <div id="socialLinks" class="social-links">
                <!-- Les liens seront chargés dynamiquement -->
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
