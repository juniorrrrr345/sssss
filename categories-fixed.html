<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catégories - Boutique</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="black-white-override.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin: 40px auto;
            padding: 0 1.5rem;
            max-width: 1400px;
        }

        @media (max-width: 1024px) {
            .categories-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .categories-grid {
                grid-template-columns: 1fr;
            }
        }

        .category-card {
            background: transparent;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #fff;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: white;
            display: block;
        }

        .category-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.3);
            border-color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .category-image-container {
            position: relative;
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
        }

        .category-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            font-size: 4rem;
            opacity: 0.3;
        }

        .category-info {
            padding: 25px;
        }

        .category-name {
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 1), 0 0 10px rgba(0, 0, 0, 1);
        }

        .category-description {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 15px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);
        }

        .category-count {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 1);
        }

        .container {
            padding-top: 2rem;
            padding-bottom: 100px;
        }

        .title {
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <h1 class="title" style="color: #fff; font-weight: 900; text-shadow: 3px 3px 6px rgba(0, 0, 0, 1), 0 0 10px rgba(0, 0, 0, 1); font-size: 2.5rem;">Nos Catégories</h1>

        <div class="categories-grid" id="categoriesGrid">
            <!-- Les catégories seront générées ici par JavaScript -->
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script src="config.js"></script>
    <script src="theme-loader.js"></script>
    <script>
        console.log('🚀 Categories.html chargé');
        
        // Charger les catégories depuis l'API
        async function loadCategories() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: white;">⏳ Chargement...</div>';
            
            try {
                const response = await fetch(`${API_URL}/api/categories`);
                const data = await response.json();
                
                if (data.success && data.categories) {
                    displayCategories(data.categories);
                } else {
                    showError('Aucune catégorie disponible');
                }
            } catch (error) {
                console.error('Erreur lors du chargement des catégories:', error);
                showError('Impossible de charger les catégories');
            }
        }

        // Afficher les catégories
        function displayCategories(categories) {
            const grid = document.getElementById('categoriesGrid');
            
            if (categories.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: white;">Aucune catégorie disponible</div>';
                return;
            }
            
            grid.innerHTML = categories.map(category => `
                <a href="products.html?category=${category.id}" class="category-card">
                    <div class="category-image-container">
                        ${category.image_url 
                            ? `<img src="${category.image_url}" alt="${category.name}" class="category-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                               <div class="no-image" style="display: none;"><i class="fas fa-image"></i></div>`
                            : `<div class="no-image"><i class="fas fa-image"></i></div>`
                        }
                    </div>
                    <div class="category-info">
                        <h3 class="category-name">${category.name}</h3>
                        ${category.description ? `<p class="category-description">${category.description}</p>` : ''}
                        <p class="category-count">${category.product_count || 0} produit${(category.product_count || 0) > 1 ? 's' : ''}</p>
                    </div>
                </a>
            `).join('');
        }

        // Afficher une erreur
        function showError(message) {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #ff6b6b;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 1rem; display: block;"></i>
                    ${message}
                </div>
            `;
        }

        // Charger les catégories au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            loadCategories();
        });
    </script>
</body>
</html>
