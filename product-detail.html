<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100K ROSIN - Al Gran</title>
    <link rel="stylesheet" href="style.css">
    <script src="icons.js"></script>
    <style>
        /* Styles spécifiques pour la page de détails du produit */
        .product-detail-container {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 0 100px;
            min-height: 100vh;
        }

        /* Carousel d'images */
        .product-carousel {
            position: relative;
            width: 100%;
            height: 70vh;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }

        .carousel-images {
            display: flex;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .carousel-image, .carousel-video {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-video {
            background: #000;
        }

        .media-type-indicator {
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 10;
        }

        .carousel-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .carousel-button:hover {
            background: rgba(255, 62, 165, 0.6);
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-button.prev {
            left: 20px;
        }

        .carousel-button.next {
            right: 20px;
        }

        .carousel-indicators {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator.active {
            background: var(--primary-pink);
            width: 30px;
            border-radius: 5px;
        }

        /* Badge LIVE ROSIN */
        .product-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--primary-pink), #ff1493);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(255, 62, 165, 0.5);
            z-index: 10;
        }

        /* Informations du produit */
        .product-info {
            padding: 1.5rem;
            background: linear-gradient(180deg, transparent, rgba(10, 14, 39, 0.95));
        }

        .product-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-farm {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 62, 165, 0.15);
            border: 1px solid var(--primary-pink);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary-pink);
            margin-bottom: 1rem;
        }

        .product-vendor {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 1.5rem;
        }

        .vendor-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-pink), var(--primary-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
        }

        .vendor-name {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Sélection de quantité */
        .quantity-section {
            margin-bottom: 2rem;
        }

        .quantity-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .quantity-options {
            display: flex;
            gap: 1rem;
        }

        .quantity-option {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .quantity-option:hover {
            border-color: var(--primary-pink);
            background: rgba(255, 62, 165, 0.1);
        }

        .quantity-option.selected {
            border-color: var(--primary-pink);
            background: rgba(255, 62, 165, 0.15);
            box-shadow: 0 5px 20px rgba(255, 62, 165, 0.3);
        }

        .quantity-weight {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
        }

        .quantity-price {
            font-size: 1.1rem;
            color: white;
            font-weight: 700;
        }

        /* Bouton principal */
        .order-button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-pink), #ff1493);
            color: white;
            border: 2px solid #25D366;
            padding: 1.2rem;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 62, 165, 0.4);
            text-transform: capitalize;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .order-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 62, 165, 0.6);
        }

        .order-button:active {
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .product-carousel {
                height: 60vh;
            }

            .product-title {
                font-size: 1.5rem;
            }

            .quantity-options {
                flex-direction: column;
            }

            .carousel-button {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .carousel-button.prev {
                left: 10px;
            }

            .carousel-button.next {
                right: 10px;
            }
        }
    </style>
</head>

        // Données des produits avec support photos et vidéos

            {

                name: "POTION",
                farm: "WIZARD TREES",
                vendor: "WIZARD MASTER",
                badge: "🌿 TOPSHELF CALIFORNIA",
                media: [
                    { type: 'image', url: 'https://images.unsplash.com/photo-1603909075879-2c6e224fd5bb?w=800&h=600&fit=crop' },
                    { type: 'video', url: 'https://www.w3schools.com/html/movie.mp4' },
                    { type: 'image', url: 'https://images.unsplash.com/photo-1587767766972-fdf899d364e6?w=800&h=600&fit=crop' }
                ],
                quantities: [
                    { weight: '3.5G', price: '110€' },
                    { weight: '7G', price: '200€' }

        // Variables globales
        let currentSlide = 0;
        let currentProduct = null;
        let selectedQuantity = null;
        let selectedPrice = null;
        let mediaElements = [];

        // Récupérer l'ID du produit depuis l'URL
        function getProductIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return parseInt(urlParams.get('id')) || 1;
        }

        // Charger et afficher le produit
        function loadProduct() {
            const productId = getProductIdFromUrl();
            currentProduct = productsData.find(p => p.id === productId) || productsData[0];

            // Mettre à jour le titre de la page
            document.title = `${currentProduct.name} - Al Gran`;

            // Mettre à jour les informations du produit
            document.getElementById('productTitle').textContent = currentProduct.name;
            document.getElementById('productBadge').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" fill="currentColor" width="1em" height="1em" style="display: inline-block; vertical-align: middle;"><path d="M316.9 18C311.6 7 300.4 0 288.1 0s-23.4 7-28.8 18L195 150.3 51.4 171.5c-12 1.8-22 10.2-25.7 21.7s-.7 24.2 7.9 32.7L137.8 329 113.2 474.7c-2 12 3 24.2 12.9 31.3s23 8 33.8 2.3l128.3-68.5 128.3 68.5c10.8 5.7 23.9 4.9 33.8-2.3s14.9-19.3 12.9-31.3L438.5 329 542.7 225.9c8.6-8.5 11.7-21.2 7.9-32.7s-13.7-19.9-25.7-21.7L381.2 150.3 316.9 18z"/></svg> ${currentProduct.badge}`;
            document.getElementById('productFarm').innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" width="1em" height="1em" style="display: inline-block; vertical-align: middle;"><path d="M272 96c-78.6 0-145.1 51.5-167.7 122.5c33.6-17 71.5-26.5 111.7-26.5h88c8.8 0 16 7.2 16 16s-7.2 16-16 16H288 216s0 0 0 0c-16.6 0-32.7 1.9-48.3 5.4c-25.9 5.9-49.9 16.4-71.4 30.7c0 0 0 0 0 0C38.3 298.8 0 364.9 0 440v16c0 13.3 10.7 24 24 24s24-10.7 24-24V440c0-48.7 20.7-92.5 53.8-123.2C121.6 392.3 190.3 448 272 448l1 0c132.1-.7 239-130.9 239-291.4c0-42.6-7.5-83.1-21.1-119.6c-2.6-6.9-12.7-6.6-16.2-.1C455.9 72.1 418.7 96 376 96L272 96z"/></svg>
                Farm: ${currentProduct.farm}
            `;
            document.getElementById('productVendor').innerHTML = `
                <div class="vendor-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" width="1em" height="1em"><path d="M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-45.7 48C79.8 304 0 383.8 0 482.3C0 498.7 13.3 512 29.7 512H418.3c16.4 0 29.7-13.3 29.7-29.7C448 383.8 368.2 304 269.7 304H178.3z"/></svg>
                </div>
                <span class="vendor-name">${currentProduct.vendor}</span>
            `;

            // Générer le carousel de médias
            generateMediaCarousel();

            // Générer les options de quantité
            generateQuantityOptions();
        }

        // Générer le carousel de médias (photos et vidéos)
        function generateMediaCarousel() {
            const carouselContainer = document.getElementById('carouselImages');
            const indicatorsContainer = document.getElementById('carouselIndicators');

            carouselContainer.innerHTML = '';
            indicatorsContainer.innerHTML = '';

            currentProduct.media.forEach((media, index) => {
                if (media.type === 'image') {
                    const img = document.createElement('img');
                    img.src = media.url;
                    img.alt = currentProduct.name;
                    img.className = 'carousel-image';
                    img.onerror = function() {
                        this.src = 'images/product-placeholder.jpg';
                    };
                    carouselContainer.appendChild(img);
                } else if (media.type === 'video') {
                    const video = document.createElement('video');
                    video.src = media.url;
                    video.className = 'carousel-video';
                    video.controls = true;
                    video.loop = true;
                    video.muted = true;
                    video.playsInline = true;
                    carouselContainer.appendChild(video);
                }

                // Créer l'indicateur
                const indicator = document.createElement('span');
                indicator.className = `indicator ${index === 0 ? 'active' : ''}`;
                indicator.onclick = () => goToSlide(index);
                indicatorsContainer.appendChild(indicator);
            });

            mediaElements = carouselContainer.children;
        }

        // Générer les options de quantité
        function generateQuantityOptions() {
            const quantityContainer = document.getElementById('quantityOptions');
            quantityContainer.innerHTML = '';

            currentProduct.quantities.forEach((qty, index) => {
                const option = document.createElement('div');
                option.className = 'quantity-option';
                option.innerHTML = `
                    <div class="quantity-weight">${qty.weight}</div>
                    <div class="quantity-price">${qty.price}</div>
                `;
                option.onclick = function() {
                    selectQuantity(this, qty.weight, qty.price);
                };
                quantityContainer.appendChild(option);
            });
        }

        // Fonction pour afficher un slide
        function showSlide(index) {
            const carouselImages = document.getElementById('carouselImages');
            if (index >= mediaElements.length) currentSlide = 0;
            if (index < 0) currentSlide = mediaElements.length - 1;
            
            carouselImages.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            // Mettre à jour les indicateurs
            const indicators = document.querySelectorAll('.indicator');
            indicators.forEach((indicator, i) => {
                indicator.classList.toggle('active', i === currentSlide);
            });

            // Gérer la lecture des vidéos
            Array.from(mediaElements).forEach((element, i) => {
                if (element.tagName === 'VIDEO') {
                    if (i === currentSlide) {
                        element.play().catch(e => console.log('Autoplay prevented'));
                    } else {
                        element.pause();
                    }
                }
            });
        }

        // Changer de slide
        function changeSlide(direction) {
            currentSlide += direction;
            if (currentSlide >= mediaElements.length) currentSlide = 0;
            if (currentSlide < 0) currentSlide = mediaElements.length - 1;
            showSlide(currentSlide);
        }

        // Aller à un slide spécifique
        function goToSlide(index) {
            currentSlide = index;
            showSlide(currentSlide);
        }

        // Sélection de quantité
        function selectQuantity(element, quantity, price) {
            document.querySelectorAll('.quantity-option').forEach(option => {
                option.classList.remove('selected');
            });
            
            element.classList.add('selected');
            selectedQuantity = quantity;
            selectedPrice = price;
        }

        // Passer commande
        function placeOrder() {
            if (!selectedQuantity) {
                alert('⚠️ Veuillez sélectionner une quantité avant de continuer.');
                return;
            }
            
            // Créer le message WhatsApp
            const message = `Bonjour! Je souhaite commander:\n\n🌿 ${currentProduct.name}\n📦 Quantité: ${selectedQuantity}\n💰 Prix: ${selectedPrice}\n🏷️ ${currentProduct.badge}`;
            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
            
            window.open(whatsappUrl, '_blank');
        }

        // Auto-play carousel (optionnel)
        let autoplayInterval = setInterval(() => {
            changeSlide(1);
        }, 5000);

        // Initialiser la page au chargement
        window.addEventListener('DOMContentLoaded', () => {
            loadProduct();
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
