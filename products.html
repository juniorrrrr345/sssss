<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tous les Produits - Al Gran</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container {
            max-width: 1400px;
            padding: 2rem 1.5rem 100px;
        }

        .products-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .search-filter-bar {
            display: flex;
            gap: 15px;
            margin: 30px auto;
            max-width: 800px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-container {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .filter-btn {
            padding: 15px 35px;
            border-radius: 25px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px auto;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .product-image-container {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-farm {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        .farm-icon {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
        }

        .product-price {
            font-size: 2rem;
            font-weight: bold;
            color: white;
        }

        .product-price .unit {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: normal;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 20px;
            }

            .product-image-container {
                height: 220px;
            }

            .search-filter-bar {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <div class="products-header">
            <h1 class="title">Tous les Produits</h1>
        </div>

        <div class="search-filter-bar">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Rechercher par nom, catégorie ou farm...">
            </div>
            <button class="filter-btn" id="filterBtn">
                <i class="fas fa-filter"></i>
                Filtres
            </button>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Les produits seront générés ici par JavaScript -->
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script src="config.js"></script>
    <script>
        console.log('🚀 Products.html chargé - Version FINALE');
        
        // Variables pour les produits
        let productsData = [];
        let allProducts = [];

        // Charger les produits depuis l'API
        async function loadProducts() {
            console.log('📦 Chargement des produits...');
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: white;">⏳ Chargement...</div>';
            
            try {
                const url = `${API_CONFIG.BASE_URL}/api/products`;
                console.log('📡 Fetching:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('✅ Données reçues:', data);
                
                if (data.success && data.products) {
                    // Filtrer seulement les produits actifs
                    allProducts = data.products.filter(p => p.is_active);
                    productsData = [...allProducts];
                    
                    console.log(`📦 ${productsData.length} produit(s) actif(s)`);
                    
                    displayProducts(productsData);
                } else {
                    console.warn('⚠️ Pas de produits dans la réponse');
                    showError('Aucun produit disponible');
                }
            } catch (error) {
                console.error('❌ Erreur lors du chargement:', error);
                showError('Impossible de charger les produits. Vérifiez que l\'API est démarrée.');
            }
        }

        // Afficher un message d'erreur
        function showError(message) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = `
                <div class="no-results">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 1rem; display: block; color: #ff6b6b;"></i>
                    ${message}
                </div>
            `;
        }

        let filteredProducts = [];

        // Créer une carte produit
        function createProductCard(product) {
            const imageUrl = product.image_url || 'https://images.unsplash.com/photo-1605792657660-596af9009e82?w=500&h=400&fit=crop';
            const badge = product.badge || (product.category_icon ? `${product.category_icon} ${product.category_name}` : '');
            
            return `
                <div class="product-card" data-id="${product.id}">
                    <div class="product-image-container">
                        <img src="${imageUrl}" alt="${product.name}" class="product-image" onerror="this.src='https://via.placeholder.com/400x280/1a1a2e/ffffff?text=${encodeURIComponent(product.name)}'">
                        ${badge ? `<div class="product-badge">${badge}</div>` : ''}
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        ${product.description ? `
                        <div class="product-farm">
                            <span class="farm-icon"></span>
                            <span>${product.description.substring(0, 50)}${product.description.length > 50 ? '...' : ''}</span>
                        </div>` : ''}
                        <div class="product-price">
                            ${product.price}€ <span class="unit">${product.unit || '/ 3.5g'}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Afficher les produits
        function displayProducts(productsToDisplay) {
            const grid = document.getElementById('productsGrid');
            if (productsToDisplay.length === 0) {
                grid.innerHTML = '<div class="no-results"><i class="fas fa-search" style="font-size: 3rem; margin-bottom: 1rem; display: block;"></i>Aucun produit trouvé</div>';
                return;
            }
            grid.innerHTML = productsToDisplay.map(createProductCard).join('');
        }

        // Recherche
        function handleSearch(term) {
            const searchTerm = term.toLowerCase().trim();
            if (searchTerm === '') {
                filteredProducts = [...allProducts];
            } else {
                filteredProducts = allProducts.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) ||
                    (p.description && p.description.toLowerCase().includes(searchTerm)) ||
                    (p.category_name && p.category_name.toLowerCase().includes(searchTerm)) ||
                    (p.badge && p.badge.toLowerCase().includes(searchTerm))
                );
            }
            displayProducts(filteredProducts);
        }

        // Événements
        document.getElementById('searchInput').addEventListener('input', (e) => {
            handleSearch(e.target.value);
        });

        document.getElementById('filterBtn').addEventListener('click', () => {
            alert('Filtres avancés bientôt disponibles ! 🎯\n\nVous pourrez filtrer par :\n- Catégorie\n- Prix\n- Type\n- Farm');
        });

        // Clic sur une carte produit
        document.addEventListener('click', (e) => {
            const card = e.target.closest('.product-card');
            if (card) {
                const productId = parseInt(card.dataset.id);
                console.log('🖱️ Clic sur produit ID:', productId);
                // Redirection vers la page de détail du produit
                window.location.href = `product-detail.html?id=${productId}`;
            }
        });

        // Affichage initial - charger les produits
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
        });
    </script>
</body>
</html>
