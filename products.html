<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tous les Produits - Al Gran</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container {
            max-width: 1400px;
            padding: 2rem 1.5rem 100px;
        }

        .products-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .search-filter-bar {
            display: flex;
            gap: 15px;
            margin: 30px auto;
            max-width: 800px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-container {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .filter-btn {
            padding: 15px 35px;
            border-radius: 25px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px auto;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .product-image-container {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-farm {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        .farm-icon {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
        }

        .product-price {
            font-size: 2rem;
            font-weight: bold;
            color: white;
        }

        .product-price .unit {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: normal;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 20px;
            }

            .product-image-container {
                height: 220px;
            }

            .search-filter-bar {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <div class="products-header">
            <h1 class="title">Tous les Produits</h1>
        </div>

        <div class="search-filter-bar">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Rechercher par nom, catégorie ou farm...">
            </div>
            <button class="filter-btn" id="filterBtn">
                <i class="fas fa-filter"></i>
                Filtres
            </button>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Les produits seront générés ici par JavaScript -->
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script src="script.js"></script>
    <script>
        // Configuration API
        const API_URL = 'http://localhost:8787'; // Utilisez votre URL d'API

        let products = [];
        let filteredProducts = [];

        // Charger les produits depuis l'API
        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/api/products`);
                const data = await response.json();
                
                if (data.success && data.products) {
                    products = data.products.map(product => ({
                        id: product.id,
                        name: product.name,
                        farm: product.farm || 'N/A',
                        badge: product.badge || product.category_icon || '📦',
                        price: product.price,
                        unit: product.unit || '/ 3.5g',
                        image: product.image_url || 'https://via.placeholder.com/500x400?text=' + encodeURIComponent(product.name)
                    }));
                    
                    filteredProducts = [...products];
                    displayProducts(filteredProducts);
                } else {
                    throw new Error('Impossible de charger les produits');
                }
            } catch (error) {
                console.error('Erreur lors du chargement des produits:', error);
                displayError();
            }
        }
        
        // Afficher une erreur
        function displayError() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = `
                <div class="no-results" style="grid-column: 1/-1;">
                    <i class="fas fa-exclamation-circle" style="font-size: 3rem; margin-bottom: 1rem; display: block;"></i>
                    Erreur lors du chargement des produits. Veuillez réessayer.
                    <button onclick="loadProducts()" style="margin-top: 1rem; padding: 0.8rem 1.5rem; background: var(--primary-pink); border: none; border-radius: 10px; color: white; cursor: pointer;">
                        Réessayer
                    </button>
                </div>
            `;
        }

        // Créer une carte produit
        function createProductCard(product) {
            return `
                <div class="product-card" data-id="${product.id}">
                    <div class="product-image-container">
                        <img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.style.background='linear-gradient(135deg, rgba(255, 62, 165, 0.3), rgba(168, 85, 247, 0.3))'">
                        <div class="product-badge">${product.badge}</div>
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <div class="product-farm">
                            <span class="farm-icon"></span>
                            <span>${product.farm}</span>
                        </div>
                        <div class="product-price">
                            ${product.price}€ <span class="unit">${product.unit}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Afficher les produits
        function displayProducts(productsToDisplay) {
            const grid = document.getElementById('productsGrid');
            if (productsToDisplay.length === 0) {
                grid.innerHTML = '<div class="no-results"><i class="fas fa-search" style="font-size: 3rem; margin-bottom: 1rem; display: block;"></i>Aucun produit trouvé</div>';
                return;
            }
            grid.innerHTML = productsToDisplay.map(createProductCard).join('');
        }

        // Recherche
        function handleSearch(term) {
            const searchTerm = term.toLowerCase().trim();
            if (searchTerm === '') {
                filteredProducts = [...products];
            } else {
                filteredProducts = products.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) ||
                    p.farm.toLowerCase().includes(searchTerm) ||
                    p.badge.toLowerCase().includes(searchTerm)
                );
            }
            displayProducts(filteredProducts);
        }

        // Événements
        document.getElementById('searchInput').addEventListener('input', (e) => {
            handleSearch(e.target.value);
        });

        document.getElementById('filterBtn').addEventListener('click', () => {
            alert('Filtres avancés bientôt disponibles ! 🎯\n\nVous pourrez filtrer par :\n- Catégorie\n- Prix\n- Type\n- Farm');
        });

        // Clic sur une carte produit
        document.addEventListener('click', (e) => {
            const card = e.target.closest('.product-card');
            if (card) {
                const productId = parseInt(card.dataset.id);
                const product = products.find(p => p.id === productId);
                if (product) {
                    // Redirection vers la page de détail du produit
                    window.location.href = `product-detail.html?id=${productId}`;
                }
            }
        });

        // Affichage initial
        loadProducts();
    </script>
</body>
</html>
