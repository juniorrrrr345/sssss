<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .search-filter-bar {
            display: flex;
            gap: 15px;
            margin: 30px auto;
            max-width: 800px;
            flex-wrap: wrap;
        }

        .search-container {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
        }

        .search-input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-pink);
            box-shadow: 0 0 20px rgba(255, 62, 165, 0.3);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .filter-btn {
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 62, 165, 0.4);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px auto;
            max-width: 1400px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 62, 165, 0.3);
            border-color: var(--primary-pink);
        }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.1);
        }

        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 6px 12px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: white;
        }

        .product-category {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .category-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-pink);
        }

        .product-price {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-pink);
        }

        .product-price .unit {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>

    <script>
        // Configuration API
        const API_URL = 'https://algran-api.calitek-junior.workers.dev';
        
        // Données chargées depuis l'API
        let products = [];
        let categories = [];
        let farms = [];
        
        // Charger les données depuis l'API
        async function loadProducts() {
            console.log('🔄 Chargement des produits depuis l\'API...');
            try {
                const response = await fetch(`${API_URL}/api/products`);
                console.log('📡 Réponse reçue:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('📦 Données reçues:', data);
                    
                    const productsArray = data.success ? data.products : data;
                    console.log('📋 Nombre de produits:', productsArray ? productsArray.length : 0);
                    
                    if (!productsArray || productsArray.length === 0) {
                        console.log('⚠️ Aucun produit disponible');
                        displayProducts([]);
                        return;
                    }
                    
                    products = productsArray.map(p => {
                        // Parser les prices qui sont en string JSON
                        let pricesArray = [];
                        try {
                            pricesArray = typeof p.prices === 'string' ? JSON.parse(p.prices) : p.prices;
                        } catch (e) {
                            console.log('⚠️ Erreur parsing prices pour', p.name, e);
                            pricesArray = [];
                        }
                        
                        const product = {
                            id: p.id,
                            name: p.name,
                            category: p.category_name || 'Sans catégorie',
                            badge: p.badge || p.farm_name || '',
                            price: pricesArray && pricesArray.length > 0 ? parseInt(pricesArray[0].price) : (p.price || 0),
                            unit: pricesArray && pricesArray.length > 0 ? `/ ${pricesArray[0].quantity}` : (p.unit ? `/ ${p.unit}` : ''),
                            image: p.image_url || 'images/product-placeholder.jpg'
                        };
                        console.log('✅ Produit traité:', product);
                        return product;
                    });
                    
                    filteredProducts = [...products];
                    console.log('🎯 Affichage de', filteredProducts.length, 'produits');
                    displayProducts(filteredProducts);
                } else {
                    console.error('❌ Erreur HTTP:', response.status);
                }
            } catch (error) {
                console.error('❌ Erreur lors du chargement des produits:', error);
                products = [];
                filteredProducts = [];
                displayProducts([]);
            }
        }
        
        // Charger le nom de la boutique et l'image de fond
        async function loadShopName() {
            try {
                const response = await fetch(`${API_URL}/api/settings`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.success && data.settings) {
                        // Nom de la boutique
                        if (data.settings.shop_name) {
                            const logoElements = document.querySelectorAll('.logo-text, #shopName');
                            logoElements.forEach(el => {
                                if (el) el.textContent = data.settings.shop_name;
                            });
                            document.title = data.settings.shop_name + ' - Produits';
                        }
                        
                        // Image de fond
                        if (data.settings.background_image_url && data.settings.background_image_url.trim() !== '') {
                            const cosmicBg = document.querySelector('.cosmic-background');
                            if (cosmicBg) {
                                cosmicBg.style.backgroundImage = `url('${data.settings.background_image_url}')`;
                                cosmicBg.style.backgroundSize = 'cover';
                                cosmicBg.style.backgroundPosition = 'center';
                                cosmicBg.style.backgroundAttachment = 'fixed';
                                cosmicBg.style.backgroundRepeat = 'no-repeat';
                                cosmicBg.style.opacity = '1';
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('Erreur lors du chargement des paramètres:', error);
            }
        }

            }

        let filteredProducts = [];

        // Créer une carte produit
        function createProductCard(product) {
            return `
                <div class="product-card" data-id="${product.id}">
                    <div style="position: relative;">
                        <img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.style.background='rgba(255, 255, 255, 0.1)'">
                        <div class="product-badge">${product.badge}</div>
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <div class="product-category">
                            <span class="category-dot"></span>
                            <span>${product.category}</span>
                        </div>
                        <div class="product-price">
                            ${product.price}€ <span class="unit">${product.unit}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Afficher les produits
        function displayProducts(productsToDisplay) {
            const grid = document.getElementById('productsGrid');
            if (productsToDisplay.length === 0) {
                grid.innerHTML = '<div class="no-results"><i class="fas fa-search" style="font-size: 3rem; margin-bottom: 1rem; display: block;"></i>Aucun produit trouvé</div>';
                return;
            }
            grid.innerHTML = productsToDisplay.map(createProductCard).join('');
        }

        // Recherche
        function handleSearch(term) {
            const searchTerm = term.toLowerCase().trim();
            if (searchTerm === '') {
                filteredProducts = [...products];
            } else {
                filteredProducts = products.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) ||
                    p.category.toLowerCase().includes(searchTerm) ||
                    p.badge.toLowerCase().includes(searchTerm)
                );
            }
            displayProducts(filteredProducts);
        }

        // Événements
        document.getElementById('searchInput').addEventListener('input', (e) => {
            handleSearch(e.target.value);
        });

        document.getElementById('filterBtn').addEventListener('click', () => {
            alert('Filtres avancés bientôt disponibles ! 🎯\n\nVous pourrez filtrer par :\n- Catégorie\n- Prix\n- Type');
        });

        // Rediriger vers la page de détails du produit au clic
        document.addEventListener('click', (e) => {
            const card = e.target.closest('.product-card');
            if (card) {
                const productId = card.dataset.id;
                if (productId) {
                    window.location.href = `product-detail.html?id=${productId}`;
                }
            }
        });

        // Affichage initial - charger les données depuis l'API
        document.addEventListener('DOMContentLoaded', () => {
            loadShopName();
            loadProducts();
        });
    </script>
