<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tous les Produits - Al Gran</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container {
            max-width: 1400px;
            padding: 2rem 1.5rem 100px;
        }

        .products-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .search-filter-bar {
            display: flex;
            gap: 15px;
            margin: 30px auto;
            max-width: 800px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-container {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        .search-input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .filter-btn {
            padding: 15px 35px;
            border-radius: 25px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            margin: 40px auto;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .product-image-container {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-farm {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        .farm-icon {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
        }

        .product-price {
            font-size: 2rem;
            font-weight: bold;
            color: white;
        }

        .product-price .unit {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: normal;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .product-image-container {
                height: 220px;
            }

            .search-filter-bar {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="cosmic-background"></div>
    <div class="bubbles-container">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container">
        <div class="products-header">
            <h1 class="title">Tous les Produits</h1>
        </div>

        <div class="search-filter-bar">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Rechercher par nom, catégorie ou farm...">
            </div>
            <button class="filter-btn" id="filterBtn">
                <i class="fas fa-filter"></i>
                Filtres
            </button>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Les produits seront générés ici par JavaScript -->
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script src="script.js"></script>
    <script>
        // Données des produits - correspondant à l'image
        const products = [
            {
                id: 1,
                name: "100K ROSIN",
                farm: "100K",
                badge: "🔥 LIVE ROSIN",
                price: 200,
                unit: "/ 2g",
                image: "https://images.unsplash.com/photo-1605792657660-596af9009e82?w=500&h=400&fit=crop"
            },
            {
                id: 2,
                name: "HASH BURGER",
                farm: "ESTATICO",
                badge: "❄️ FROZEN USA US",
                price: 120,
                unit: "/ 5g",
                image: "https://images.unsplash.com/photo-1536964310528-e47dd655ecf3?w=500&h=400&fit=crop"
            },
            {
                id: 3,
                name: "POTION",
                farm: "WIZARD TREES",
                badge: "🌿 TOPSHELF CALIFORNIA BRANDED US",
                price: 110,
                unit: "/ 3,5g",
                image: "https://images.unsplash.com/photo-1603909075879-2c6e224fd5bb?w=500&h=400&fit=crop"
            },
            {
                id: 4,
                name: "ZANGBANGER",
                farm: "WIZARD TREES",
                badge: "🌿 TOPSHELF CALIFORNIA BRANDED US",
                price: 110,
                unit: "/ 3,5g",
                image: "https://images.unsplash.com/photo-1566054757965-20c27d98b0e2?w=500&h=400&fit=crop"
            },
            {
                id: 5,
                name: "TOP DRY",
                farm: "NOFARM",
                badge: "💨 DRY MA",
                price: 50,
                unit: "/ 5g",
                image: "https://images.unsplash.com/photo-1587767766972-fdf899d364e6?w=500&h=400&fit=crop"
            },
            {
                id: 6,
                name: "DARK MATTER",
                farm: "COSMIC FARMS",
                badge: "🌿 TOPSHELF",
                price: 110,
                unit: "/ 3.5g",
                image: "https://images.unsplash.com/photo-1610896650098-34d3af7d98be?w=500&h=400&fit=crop"
            },
            {
                id: 7,
                name: "CONCRETE JUNGLE",
                farm: "URBAN GROW",
                badge: "💎 BRANDED",
                price: 180,
                unit: "/ 7g",
                image: "https://images.unsplash.com/photo-1563181672-99f84b03c2e5?w=500&h=400&fit=crop"
            },
            {
                id: 8,
                name: "ZKITTLEZ",
                farm: "RAINBOW FARMS",
                badge: "🌈 TOPSHELF",
                price: 180,
                unit: "/ 7g",
                image: "https://images.unsplash.com/photo-1587760560986-1c8b85fc89e8?w=500&h=400&fit=crop"
            },
            {
                id: 9,
                name: "BIG Z",
                farm: "PURPLE HAZE",
                badge: "💜 PREMIUM",
                price: 100,
                unit: "/ 3.5g",
                image: "https://images.unsplash.com/photo-1608571387750-4d14e2a4c179?w=500&h=400&fit=crop"
            },
            {
                id: 10,
                name: "GUSHMINTZ",
                farm: "MINTY FRESH",
                badge: "❄️ STATIC",
                price: 170,
                unit: "/ 5g",
                image: "https://images.unsplash.com/photo-1620912366589-b0c5285c2fc2?w=500&h=400&fit=crop"
            }
        ];

        let filteredProducts = [...products];

        // Créer une carte produit
        function createProductCard(product) {
            return `
                <div class="product-card" data-id="${product.id}">
                    <div class="product-image-container">
                        <img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.style.background='linear-gradient(135deg, rgba(255, 62, 165, 0.3), rgba(168, 85, 247, 0.3))'">
                        <div class="product-badge">${product.badge}</div>
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <div class="product-farm">
                            <span class="farm-icon"></span>
                            <span>${product.farm}</span>
                        </div>
                        <div class="product-price">
                            ${product.price}€ <span class="unit">${product.unit}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Afficher les produits
        function displayProducts(productsToDisplay) {
            const grid = document.getElementById('productsGrid');
            if (productsToDisplay.length === 0) {
                grid.innerHTML = '<div class="no-results"><i class="fas fa-search" style="font-size: 3rem; margin-bottom: 1rem; display: block;"></i>Aucun produit trouvé</div>';
                return;
            }
            grid.innerHTML = productsToDisplay.map(createProductCard).join('');
        }

        // Recherche
        function handleSearch(term) {
            const searchTerm = term.toLowerCase().trim();
            if (searchTerm === '') {
                filteredProducts = [...products];
            } else {
                filteredProducts = products.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) ||
                    p.farm.toLowerCase().includes(searchTerm) ||
                    p.badge.toLowerCase().includes(searchTerm)
                );
            }
            displayProducts(filteredProducts);
        }

        // Événements
        document.getElementById('searchInput').addEventListener('input', (e) => {
            handleSearch(e.target.value);
        });

        document.getElementById('filterBtn').addEventListener('click', () => {
            alert('Filtres avancés bientôt disponibles ! 🎯\n\nVous pourrez filtrer par :\n- Catégorie\n- Prix\n- Type\n- Farm');
        });

        // Clic sur une carte produit
        document.addEventListener('click', (e) => {
            const card = e.target.closest('.product-card');
            if (card) {
                const productId = parseInt(card.dataset.id);
                const product = products.find(p => p.id === productId);
                if (product) {
                    // Redirection vers la page de détail du produit
                    window.location.href = `product-detail.html?id=${productId}`;
                }
            }
        });

        // Affichage initial
        displayProducts(filteredProducts);
    </script>
</body>
</html>
