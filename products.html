    <style>
        /* Styles spécifiques pour la page produits */
        .page-header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            z-index: 10;
        }

        .page-title {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-pink), var(--primary-purple), var(--primary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(255, 62, 165, 0.5);
            margin-bottom: 1rem;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1) drop-shadow(0 0 30px rgba(255, 62, 165, 0.5)); }
            50% { filter: brightness(1.2) drop-shadow(0 0 40px rgba(255, 62, 165, 0.8)); }
        }

        .search-filter-bar {
            display: flex;
            gap: 1rem;
            margin: 2rem auto;
            max-width: 800px;
            flex-wrap: wrap;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .search-container {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-pink);
            filter: drop-shadow(0 0 5px rgba(255, 62, 165, 0.6));
        }

        .search-input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border-radius: 25px;
            border: 2px solid rgba(255, 62, 165, 0.3);
            background: rgba(26, 20, 60, 0.8);
            backdrop-filter: blur(20px);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-pink);
            box-shadow: 0 0 25px rgba(255, 62, 165, 0.5);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .filter-btn {
            padding: 15px 35px;
            border-radius: 25px;
            border: 2px solid rgba(255, 62, 165, 0.3);
            background: linear-gradient(135deg, rgba(255, 62, 165, 0.1), rgba(168, 85, 247, 0.1));
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            backdrop-filter: blur(20px);
        }

        .filter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 62, 165, 0.4);
            background: linear-gradient(135deg, rgba(255, 62, 165, 0.2), rgba(168, 85, 247, 0.2));
            border-color: var(--primary-pink);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin: 40px auto;
            position: relative;
            z-index: 10;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--card-border);
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 62, 165, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 50px rgba(255, 62, 165, 0.3);
            border-color: rgba(255, 62, 165, 0.5);
        }

        .product-image-container {
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255, 62, 165, 0.1), rgba(168, 85, 247, 0.1));
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.1);
        }

        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(20px);
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid var(--primary-pink);
            box-shadow: 0 4px 20px rgba(255, 62, 165, 0.3);
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-farm {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        .farm-icon {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary-pink);
            box-shadow: 0 0 10px rgba(255, 62, 165, 0.8);
        }

        .product-price {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-pink), var(--primary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(255, 62, 165, 0.5));
        }

        .product-price .unit {
            font-size: 1rem;
            opacity: 0.8;
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 20px rgba(255, 62, 165, 0.5));
        }

        /* Animation d'entrée des produits */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card {
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
        }

        .product-card:nth-child(1) { animation-delay: 0.1s; }
        .product-card:nth-child(2) { animation-delay: 0.2s; }
        .product-card:nth-child(3) { animation-delay: 0.3s; }
        .product-card:nth-child(4) { animation-delay: 0.4s; }
        .product-card:nth-child(5) { animation-delay: 0.5s; }
        .product-card:nth-child(6) { animation-delay: 0.6s; }
        .product-card:nth-child(7) { animation-delay: 0.7s; }
        .product-card:nth-child(8) { animation-delay: 0.8s; }
        .product-card:nth-child(9) { animation-delay: 0.9s; }
        .product-card:nth-child(10) { animation-delay: 1s; }

        /* Container ajustements */
        .container {
            margin-top: 2rem;
            position: relative;
            z-index: 10;
        }

        /* Loader */
        .loader-container {
            text-align: center;
            padding: 60px 20px;
        }

        .loader {
            display: inline-block;
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 62, 165, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary-pink);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {

                font-size: 2.5rem;
            }

                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));

            }

            .product-image-container {
                height: 220px;
            }

            .search-filter-bar {
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

        // Afficher les produits
        function displayProducts(productsToDisplay) {
            const grid = document.getElementById('productsGrid');
            const loader = document.getElementById('loadingContainer');
            
            // Afficher le loader
            loader.style.display = 'block';
            grid.style.display = 'none';
            
            // Simuler un léger délai pour l'effet de chargement
            setTimeout(() => {
                loader.style.display = 'none';
                grid.style.display = 'grid';
                
                if (productsToDisplay.length === 0) {
                    grid.innerHTML = `
                        <div class="no-results" style="grid-column: 1 / -1;">
                            <div class="empty-state-icon">🔍</div>
                            <h3>Aucun produit trouvé</h3>
                            <p>Essayez de modifier vos critères de recherche</p>
                        </div>
                    `;
                    return;
                }
                grid.innerHTML = productsToDisplay.map(createProductCard).join('');
            }, 300);
        }

        // Filtrer les produits
        function filterProducts() {
            filteredProducts = products.filter(product => {
                const matchesSearch = currentFilters.search === '' || 
                    product.name.toLowerCase().includes(currentFilters.search) ||
                    product.farm.toLowerCase().includes(currentFilters.search) ||
                    product.badge.toLowerCase().includes(currentFilters.search);
                
                const matchesCategory = currentFilters.category === '' || 
                    product.category === currentFilters.category;
                
                const matchesPrice = product.price <= currentFilters.maxPrice;
                
                return matchesSearch && matchesCategory && matchesPrice;
            });
            
            displayProducts(filteredProducts);
        }

        // Recherche
        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentFilters.search = e.target.value.toLowerCase().trim();
            filterProducts();
        });

        // Ouvrir la modal des filtres
        document.getElementById('filterBtn').addEventListener('click', () => {
            document.getElementById('filterModal').style.display = 'block';
        });

        // Fermer la modal
        function closeFilterModal() {
            document.getElementById('filterModal').style.display = 'none';
        }

        // Appliquer les filtres
        function applyFilters() {
            currentFilters.category = document.getElementById('categoryFilter').value;
            currentFilters.maxPrice = parseInt(document.getElementById('priceFilter').value);
            filterProducts();
            closeFilterModal();
        }

        // Mise à jour du prix en temps réel
        document.getElementById('priceFilter').addEventListener('input', (e) => {
            document.getElementById('priceValue').textContent = e.target.value + '€';
        });

        // Clic sur une carte produit
        document.addEventListener('click', (e) => {
            const card = e.target.closest('.product-card');
            if (card) {
                const productId = parseInt(card.dataset.id);
                const product = products.find(p => p.id === productId);
                if (product) {
                    // Animation de clic
                    card.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        window.location.href = `product-detail.html?id=${productId}`;
                    }, 150);
                }
            }
        });

        // Fermer la modal en cliquant à l'extérieur
        document.getElementById('filterModal').addEventListener('click', (e) => {
            if (e.target.id === 'filterModal') {
                closeFilterModal();
            }
        });

        // Initialiser les animations Lottie
        document.addEventListener('DOMContentLoaded', () => {
            // Animation décorative
            lottie.loadAnimation({
                container: document.getElementById('decorAnimation'),
                renderer: 'svg',
                loop: true,
                autoplay: true,
                path: 'https://lottie.host/c9a5b8e0-5c4a-4d7f-a5e0-3a4d9c8f7b6a/shopping-cart.json'
            });
            
            // Affichage initial des produits
            displayProducts(filteredProducts);
        });
    </script>
</body>
</html>
