<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produits - Al Gran</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            padding: 1.5rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 1rem;
        }

        .logo-text {
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff !important;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* Search Bar */
        .search-container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 1rem 3rem 1rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-bar:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ff3ea5;
            box-shadow: 0 0 20px rgba(255, 62, 165, 0.3);
        }

        .search-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #ff3ea5;
            font-size: 1.2rem;
        }

        /* Filters */
        .filters-container {
            padding: 1rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            max-width: 1400px;
            margin: 0 auto;
        }

        .filter-select {
            flex: 1;
            min-width: 180px;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .filter-select:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary-pink);
            box-shadow: 0 0 15px rgba(255, 62, 165, 0.3);
        }

        .filter-select option {
            background: #1a0a2e;
            color: white;
            padding: 0.5rem;
        }

        .filter-btn {
            padding: 0.8rem 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: white;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .filter-btn:hover {
            background: linear-gradient(135deg, #ff3ea5, #a855f7);
            border-color: transparent;
            transform: scale(1.05);
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
            padding: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Product Card */
        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #ff3ea5;
            box-shadow: 0 8px 25px rgba(255, 62, 165, 0.3);
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: linear-gradient(135deg, rgba(255, 62, 165, 0.2), rgba(168, 85, 247, 0.2));
            position: relative;
        }

        .product-badge {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .product-flag {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            font-size: 1.2rem;
        }

        .product-content {
            padding: 1rem;
        }

        .product-name {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 0.3rem;
            color: white;
            line-height: 1.2;
        }

        .product-farm {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #ff3ea5, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .product-category {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-unit {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 1rem;
        }

        .empty-state p {
            color: rgba(255, 255, 255, 0.6);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 14, 39, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: space-around;
            padding: 0.5rem 0;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
        }

        .nav-icon-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .nav-item.active .nav-icon-circle {
            background: linear-gradient(135deg, #ff3ea5, #a855f7);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(255, 62, 165, 0.5);
        }

        .nav-item.active {
            color: white;
        }

        .nav-item.active .nav-icon-circle i {
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.8));
        }

        .nav-item:not(.active):hover .nav-icon-circle {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 62, 165, 0.4);
            transform: translateY(-3px);
        }

        .nav-item:not(.active):hover {
            color: white;
        }

        .nav-label {
            font-weight: 500;
            font-size: 0.75rem;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            grid-column: 1 / -1;
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo-container">
            <div class="logo-text" id="shopName">Al Gran</div>
        </div>
        <div class="search-container">
            <input 
                type="text" 
                class="search-bar" 
                id="searchInput"
                placeholder="Rechercher par nom, catégorie ou farm..."
            >
            <i class="fas fa-search search-icon"></i>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters-container" id="filtersContainer">
        <select class="filter-select" id="categoryFilter">
            <option value="all">Toutes les catégories</option>
        </select>
        
        <select class="filter-select" id="farmFilter">
            <option value="all">Toutes les farms</option>
        </select>
        
        <button class="filter-btn" id="resetFilters">
            <i class="fas fa-redo"></i> Réinitialiser
        </button>
    </div>

    <!-- Products Grid -->
    <div class="products-grid" id="productsGrid">
        <div class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <p style="margin-top: 1rem; color: rgba(255,255,255,0.6);">Chargement des produits...</p>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-home"></i>
            </div>
            <span class="nav-label">Accueil</span>
        </a>
        <a href="products.html" class="nav-item active">
            <div class="nav-icon-circle">
                <i class="fas fa-shopping-bag"></i>
            </div>
            <span class="nav-label">Produits</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-th"></i>
            </div>
            <span class="nav-label">Catégories</span>
        </a>
        <a href="contact.html" class="nav-item">
            <div class="nav-icon-circle">
                <i class="fas fa-envelope"></i>
            </div>
            <span class="nav-label">Contact</span>
        </a>
    </nav>

    <script>
        // Configuration API
        const API_URL = 'https://algran-api.calitek-junior.workers.dev';

        let allProducts = [];
        let allCategories = [];
        let allFarms = [];
        let currentCategoryFilter = 'all';
        let currentFarmFilter = 'all';

        // Charger les données au démarrage
        document.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([
                loadShopName(),
                loadProducts(),
                loadCategories(),
                loadFarms()
            ]);
            
            // Event listeners
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            document.getElementById('categoryFilter').addEventListener('change', handleCategoryFilter);
            document.getElementById('farmFilter').addEventListener('change', handleFarmFilter);
            document.getElementById('resetFilters').addEventListener('click', resetFilters);
        });

        // Charger le nom de la boutique
        async function loadShopName() {
            try {
                const response = await fetch(`${API_URL}/api/settings`);
                const data = await response.json();
                
                if (data.success && data.settings) {
                    if (data.settings.shop_name) {
                        const shopNameEl = document.getElementById('shopName');
                        shopNameEl.textContent = data.settings.shop_name;
                        shopNameEl.style.color = '#ffffff';
                        shopNameEl.style.background = 'none';
                        shopNameEl.style.webkitTextFillColor = '#ffffff';
                        document.title = `Produits - ${data.settings.shop_name}`;
                    }
                    
                    // Appliquer l'image de fond si définie
                    if (data.settings.background_image_url) {
                        document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('${data.settings.background_image_url}')`;
                        document.body.style.backgroundSize = 'cover';
                        document.body.style.backgroundPosition = 'center';
                        document.body.style.backgroundAttachment = 'fixed';
                        document.body.style.backgroundRepeat = 'no-repeat';
                    }
                }
            } catch (error) {
                console.error('Erreur chargement nom boutique:', error);
            }
        }

        // Charger les produits
        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/api/products`);
                const data = await response.json();
                
                if (data.success && data.products) {
                    allProducts = data.products;
                    displayProducts(allProducts);
                } else {
                    displayEmptyState('Aucun produit disponible');
                }
            } catch (error) {
                console.error('Erreur chargement produits:', error);
                displayEmptyState('Erreur de chargement');
            }
        }

        // Charger les catégories pour les filtres
        async function loadCategories() {
            try {
                const response = await fetch(`${API_URL}/api/categories`);
                const data = await response.json();
                
                if (data.success && data.categories) {
                    allCategories = data.categories;
                    populateCategoryFilter(allCategories);
                }
            } catch (error) {
                console.error('Erreur chargement catégories:', error);
            }
        }

        // Charger les farms
        async function loadFarms() {
            try {
                const response = await fetch(`${API_URL}/api/farms`);
                const data = await response.json();
                
                if (data.success && data.farms) {
                    allFarms = data.farms;
                    populateFarmFilter(allFarms);
                }
            } catch (error) {
                console.error('Erreur chargement farms:', error);
            }
        }

        // Remplir le select des catégories
        function populateCategoryFilter(categories) {
            const select = document.getElementById('categoryFilter');
            const options = categories.map(cat => 
                `<option value="${cat.id}">${cat.icon || '📦'} ${cat.name}</option>`
            ).join('');
            select.innerHTML = `<option value="all">Toutes les catégories</option>${options}`;
        }

        // Remplir le select des farms
        function populateFarmFilter(farms) {
            const select = document.getElementById('farmFilter');
            const options = farms.map(farm => 
                `<option value="${farm.id}">${farm.name}</option>`
            ).join('');
            select.innerHTML = `<option value="all">Toutes les farms</option>${options}`;
        }

        // Filtrer par catégorie
        function handleCategoryFilter(e) {
            currentCategoryFilter = e.target.value;
            applyFilters();
        }

        // Filtrer par farm
        function handleFarmFilter(e) {
            currentFarmFilter = e.target.value;
            applyFilters();
        }

        // Réinitialiser les filtres
        function resetFilters() {
            currentCategoryFilter = 'all';
            currentFarmFilter = 'all';
            document.getElementById('categoryFilter').value = 'all';
            document.getElementById('farmFilter').value = 'all';
            document.getElementById('searchInput').value = '';
            applyFilters();
        }

        // Appliquer tous les filtres
        function applyFilters() {
            let filtered = allProducts;
            
            // Filtrer par catégorie
            if (currentCategoryFilter !== 'all') {
                filtered = filtered.filter(p => p.category_id == currentCategoryFilter);
            }
            
            // Filtrer par farm
            if (currentFarmFilter !== 'all') {
                filtered = filtered.filter(p => p.farm_id == currentFarmFilter);
            }
            
            // Recherche textuelle
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) ||
                    (p.description && p.description.toLowerCase().includes(searchTerm)) ||
                    (p.category_name && p.category_name.toLowerCase().includes(searchTerm)) ||
                    (p.farm_name && p.farm_name.toLowerCase().includes(searchTerm))
                );
            }
            
            displayProducts(filtered);
        }

        // Recherche
        function handleSearch(e) {
            applyFilters();
        }

        // Afficher les produits
        function displayProducts(products) {
            const grid = document.getElementById('productsGrid');
            
            if (products.length === 0) {
                displayEmptyState('Aucun produit trouvé');
                return;
            }
            
            const productsHTML = products.map(product => {
                const imageUrl = product.image_url || '';
                const badge = product.badge || product.category_icon || '';
                const price = parseFloat(product.price) || 0;
                const unit = product.unit || '';
                const farmName = product.farm_name || product.category_name || 'PREMIUM';
                
                return `
                    <div class="product-card" onclick="showProductDetails(${product.id})">
                        <div class="product-image" style="${imageUrl ? `background-image: url('${imageUrl}'); background-size: cover; background-position: center;` : ''}">
                            ${badge ? `<div class="product-badge">${badge}</div>` : ''}
                        </div>
                        <div class="product-content">
                            <div class="product-name">${product.name}</div>
                            <div class="product-farm">${farmName}</div>
                            <div>
                                <span class="product-price">${price}€</span>
                                <span class="product-unit">${unit}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            grid.innerHTML = productsHTML;
        }

        // État vide
        function displayEmptyState(message) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <p>${message}</p>
                </div>
            `;
        }

        // Afficher les détails d'un produit
        function showProductDetails(productId) {
            window.location.href = `product-detail.html?id=${productId}`;
        }
    </script>
</body>
</html>
